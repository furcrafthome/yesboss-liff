<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ตั้งนาฬิกาปลุก — YES BOSS</title>
<style>
  :root { --pink:#E8779B; --rose:#B85C7E; --soft:#F4A9C0; --gray:#6E6E73; --bg:#FFF7FA; --ink:#2B2B2E; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body { margin:0; padding:26px 20px; font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
         background:linear-gradient(180deg,#FBE7EE,var(--bg) 45%); color:var(--ink); line-height:1.6;
         display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; }
  .card { background:#fff; border-radius:24px; padding:26px 22px; width:100%; max-width:360px;
          box-shadow:0 3px 0 #F6E3EA, 0 6px 0 #EFD6DF, 0 14px 26px rgba(184,92,126,.15); }
  .emoji { font-size:40px; }
  .msg  { font-size:22px; font-weight:800; margin:6px 0 0; word-break:break-word; }
  .time { font-size:56px; font-weight:800; letter-spacing:-1px; margin:0; color:var(--rose); }
  .day  { font-size:13.5px; color:var(--pink); font-weight:700; margin:2px 0 16px; }
  button { width:100%; border:0; border-radius:16px; padding:17px; font-size:17px;
           font-weight:800; background:var(--rose); color:#fff; font-family:inherit;
           box-shadow:0 4px 14px rgba(184,92,126,.3); }
  button.alt { background:#FDF0F5; color:var(--rose); box-shadow:none; font-size:15px; padding:13px; margin-top:10px; }
  .note { font-size:13px; color:var(--gray); margin-top:14px; }
  .ok   { font-size:15px; font-weight:700; color:#177E37; margin-top:12px; display:none; }
  .how  { display:none; background:#FDF0F5; border-radius:14px; padding:14px 16px; margin-top:14px;
          font-size:14.5px; text-align:left; line-height:1.9; }
  .how b { color:var(--rose); }
  .how .stepn { display:inline-block; width:22px; height:22px; border-radius:50%; background:var(--pink);
                color:#fff; font-size:12.5px; font-weight:800; text-align:center; line-height:22px; margin-right:6px; }
  .step { display:none; flex-direction:column; align-items:center; width:100%; }
  .step.on { display:flex; }
</style>
</head>
<body>

<div class="step on" id="ready">
  <div class="card">
    <div class="emoji" id="ic">⏰</div>
    <p class="msg" id="m">นัดของบอส</p>
    <p class="time" id="t">--:--</p>
    <p class="day" id="d"></p>
    <button id="mainBtn" onclick="setAlarm(true)">⏰ ตั้งปลุกในเครื่อง</button>
    <div class="how" id="how">
      <span class="stepn">1</span>เปิดแอป <b>นาฬิกา</b> → แถบ <b>ปลุก</b><br>
      <span class="stepn">2</span>กด <b>+</b> → หมุนเวลาเป็น <b id="ht">--:--</b><br>
      <span class="stepn">3</span>แตะ <b>ป้ายกำกับ</b> → วางชื่อนัด (คัดลอกไว้ให้แล้ว) → <b>บันทึก</b>
      <button class="alt" id="copyBtn" onclick="copyName()">📋 คัดลอกชื่อนัดอีกครั้ง</button>
    </div>
    <p class="ok" id="okmsg">✅ สั่งตั้งปลุกแล้ว — เช็คในแอปนาฬิกาได้เลย</p>
    <p class="note" id="note"></p>
  </div>
</div>

<div class="step" id="bad">
  <div style="font-size:46px">🤔</div>
  <p style="font-size:16px;color:var(--gray);max-width:300px">ลิงก์นี้ไม่สมบูรณ์<br>กลับไปกดปุ่มในแชทใหม่อีกทีนะคะ</p>
</div>

<script>
var P = new URLSearchParams(location.search);
var raw = (P.get("t") || "").trim();
var label = (P.get("msg") || "นัดของบอส").slice(0, 60);
var m = raw.replace(":", "").match(/^(\d{1,2})(\d{2})$/);
var H = m ? parseInt(m[1], 10) : NaN;
var M = m ? parseInt(m[2], 10) : NaN;
var ok = m && H >= 0 && H <= 23 && M >= 0 && M <= 59;

var ua = navigator.userAgent;
var isAnd = /Android/i.test(ua);
function pad(n) { return (n < 10 ? "0" : "") + n; }
var TIME = ok ? pad(H) + ":" + pad(M) : "--:--";

if (!ok) {
  document.getElementById("ready").className = "step";
  document.getElementById("bad").className = "step on";
} else {
  document.getElementById("t").textContent = TIME;
  document.getElementById("m").textContent = label;
  document.getElementById("ht").textContent = TIME;
  var now = new Date();
  var target = new Date(); target.setHours(H, M, 0, 0);
  document.getElementById("d").textContent = (target > now ? "ปลุกวันนี้" : "ปลุกพรุ่งนี้") + " · ดังทะลุแม้ปิดเสียงไลน์";

  if (isAnd) {
    // 🤖 Android: ลองตั้งให้เองก่อน (บางเครื่องยอม) — ไม่สำเร็จค่อยโชว์วิธีตั้งเอง
    document.getElementById("note").textContent = "กำลังตั้งให้อัตโนมัติ… ถ้าไม่มีอะไรเกิดขึ้น กดปุ่มด้านบน";
    setTimeout(setAlarm, 450);
  } else {
    // 🍎 iPhone: ไม่มีการติดตั้งใดๆ อีกแล้ว (มติบอส 28 ส.ค. — ระบบทางลัดซับซ้อนเกินไปสำหรับลูกค้าจริง)
    //    ปุ่มเดียว = โชว์วิธีตั้งเอง 15 วินาที + คัดลอกชื่อนัดให้เลย ทำได้ 100% ทุกเครื่อง
    document.getElementById("mainBtn").textContent = "⏰ ดูวิธีตั้งปลุก 15 วินาที";
    document.getElementById("note").textContent = "iPhone ตั้งเองแป๊บเดียว มีขั้นตอนกางให้ครบค่ะ";
  }
}

function fired() {
  document.getElementById("okmsg").style.display = "block";
  document.getElementById("ic").textContent = "✅";
}
function copyName() {
  try { navigator.clipboard.writeText(label); } catch (e) {}
  var c = document.getElementById("copyBtn");
  if (c) c.textContent = "✅ คัดลอกแล้ว — ไปวางในป้ายกำกับได้เลย";
}
function showHow() {
  copyName();
  document.getElementById("how").style.display = "block";
  document.getElementById("mainBtn").style.display = "none";
  document.getElementById("note").textContent = "";
}
function setAlarm(fromTap) {
  if (!isAnd) { showHow(); return; }
  // Android: เบราว์เซอร์ยอมเปิดแอปนาฬิกาเฉพาะจากการกดของผู้ใช้ — auto-fire อาจถูกบล็อกเงียบ
  var leftA = false;
  function onLeaveA() { leftA = true; }
  document.addEventListener("visibilitychange", onLeaveA);
  window.addEventListener("pagehide", onLeaveA);
  window.addEventListener("blur", onLeaveA);
  setTimeout(function () {
    document.removeEventListener("visibilitychange", onLeaveA);
    window.removeEventListener("pagehide", onLeaveA);
    window.removeEventListener("blur", onLeaveA);
    if (leftA || document.hidden) { fired(); }
    else if (fromTap) { showHow(); }
    else { document.getElementById("note").textContent = "กดปุ่มด้านบนหนึ่งครั้งเพื่อตั้งปลุกนะคะ"; }
  }, 1600);
  location.href = "intent://alarm#Intent;action=android.intent.action.SET_ALARM" +
    ";i.android.intent.extra.alarm.HOUR=" + H +
    ";i.android.intent.extra.alarm.MINUTES=" + M +
    ";S.android.intent.extra.alarm.MESSAGE=" + encodeURIComponent(label) +
    ";B.android.intent.extra.alarm.SKIP_UI=true;end";
}
</script>
</body>
</html>
