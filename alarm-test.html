<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เทสนาฬิกาปลุก — YES BOSS</title>
<style>
  :root { --pink:#E8779B; --soft:#F4A9C0; --gray:#6E6E73; --bg:#FFF7FA; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body { margin:0; padding:32px 22px; font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
         background:var(--bg); color:#2B2B2E; line-height:1.6;
         display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; }
  h1 { font-size:22px; margin:0 0 10px; }
  p  { font-size:15px; color:var(--gray); margin:0 0 28px; max-width:320px; }
  button { width:100%; max-width:320px; border:0; border-radius:14px; padding:20px; font-size:18px;
           font-weight:700; background:var(--pink); color:#fff; font-family:inherit; box-shadow:0 4px 14px rgba(232,119,155,.3); }
  .big { font-size:52px; margin-bottom:6px; }
  .verdict { font-size:22px; font-weight:700; margin-bottom:10px; }
  .ok  { color:#B8437A; }
  .bad { color:var(--gray); }
  .hint { font-size:15px; color:var(--gray); max-width:300px; }
  .step { display:none; flex-direction:column; align-items:center; width:100%; }
  .step.on { display:flex; }
</style>
</head>
<body>

<div class="step on" id="s1">
  <div class="big">⏰</div>
  <h1>แตะปุ่มนี้ทีเดียว</h1>
  <p>ถ้าแอปนาฬิกาเด้งขึ้นมา ให้ปิดแล้วกลับมาหน้านี้<br>ไม่ต้องทำอะไรในแอปนาฬิกา</p>
  <button onclick="go()">แตะที่นี่</button>
</div>

<div class="step" id="s2">
  <div class="big" id="icon"></div>
  <div class="verdict" id="verdict"></div>
  <div class="hint" id="hint"></div>
</div>

<script>
function go() {
  var left = false;
  function onLeave() { left = true; }
  document.addEventListener('visibilitychange', onLeave);
  window.addEventListener('pagehide', onLeave);
  window.addEventListener('blur', onLeave);

  setTimeout(function () {
    document.removeEventListener('visibilitychange', onLeave);
    window.removeEventListener('pagehide', onLeave);
    window.removeEventListener('blur', onLeave);
    verdict(left || document.hidden);
  }, 1800);

  try { window.location.href = 'clock-alarm://'; } catch (e) { verdict(false); }
}

function verdict(worked) {
  document.getElementById('s1').className = 'step';
  document.getElementById('s2').className = 'step on';
  if (worked) {
    document.getElementById('icon').textContent = '💗';
    document.getElementById('verdict').className = 'verdict ok';
    document.getElementById('verdict').textContent = 'เยี่ยม! ทางนี้แหละ';
    document.getElementById('hint').textContent = 'บอกผมว่า "เด้ง" พอครับ';
  } else {
    document.getElementById('icon').textContent = '🙂';
    document.getElementById('verdict').className = 'verdict bad';
    document.getElementById('verdict').textContent = 'ไม่เด้ง ก็ไม่เป็นไร';
    document.getElementById('hint').textContent = 'บอกผมว่า "ไม่เด้ง" พอครับ เรายังมีอีกทางที่ใช้ได้แน่';
  }
}
</script>
</body>
</html>
