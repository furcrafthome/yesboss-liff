<style>
/* ═══ 🎨 ระบบสี — ตรวจ WCAG AA แล้วทุกคู่ (ตรวจหน้าบ้าน 25 ก.ค. พบตก 11 จาก 14 จุด) ═══
   แยก 2 ชั้นโดยตั้งใจ:
   --brand (#ED6885) = สีแบรนด์ ใช้กับของ "ตกแต่ง/ตัวใหญ่" เท่านั้น (ตัวเลขใหญ่ แถบ ไอคอน จุด)
   --brand-ink (#C92A5E) = ใช้ทุกที่ที่มี "ตัวหนังสือทับอยู่" (ปุ่ม แถบล่างที่เลือก) — ขาวบนสีนี้ได้ 5.28
   เดิมปุ่มหลักใช้ #ED6885 ตัวหนังสือขาว = 3.03 ตกมาตรฐาน กลางแดดอ่านไม่ออกจริง */
:root{
  color-scheme:light dark;
  --bg:#FAF3F6; --surface:#fff; --line:#F0DCE4; --line2:#F3E3EA;
  --ink:#26262E; --ink-strong:#23232B; --muted:#6F6F78;   /* muted 4.98 บนขาว / 4.77 บนพื้น (พื้นชมพูอ่อนสว่างเท่าพื้นเทาเดิม) */
  --brand:#ED6885; --brand-ink:#C92A5E; --brand-soft:#FCE0EA; --brand-line:#F0C9D8; --field:#FBF6F8;
  --pos:#177E37; --neg:#C62828;                            /* รายรับ 5.15 / รายจ่าย 5.62 */
  --pill-bg:#F6E9EE; --shadow:rgba(237,104,133,.10);
  --paper1:#F6E3EA; --paper2:#EFD6DF; --bg-top:#F7E3EB;    /* 🎀 ขอบกระดาษซ้อนชั้น + ไล่เฉดหัวจอ (ธีม papercraft = เมนู v14) */
  --tap:44px;                                              /* พื้นที่กดขั้นต่ำ iOS/Android/WCAG */
}
/* 🌙 โหมดมืด — LINE มีโหมดมืดทั้ง iOS/Android เดิมหน้านี้ล็อก light ไว้ = จอขาวจ้าใส่กลางดึก */
@media (prefers-color-scheme:dark){
  :root{
    --bg:#16161C; --surface:#1F1F27; --line:#2E2E38; --line2:#2A2A33;
    --ink:#EDEDF2; --ink-strong:#fff; --muted:#A9A9B6;
    --brand:#FF9FBB; --brand-ink:#FF9FBB; --brand-soft:#3A2530; --brand-line:#4A2F3B; --field:#24242D;
    --pos:#5DD47C; --neg:#FF8A80; --pill-bg:#2A2A33; --shadow:rgba(0,0,0,.4);
    --paper1:#17171E; --paper2:#121218; --bg-top:#16161C;
  }
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,var(--bg-top),var(--bg) 260px);color:var(--ink);font-family:-apple-system,'Sukhumvit Set','Noto Sans Thai',sans-serif;padding:16px 14px calc(112px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
/* ⌨️ กรอบโฟกัส: เดิมมี outline:none ในฟอร์มลงทะเบียน เหลือแค่เปลี่ยนสีขอบ 1.5px = แทบมองไม่เห็น */
:focus-visible{outline:3px solid var(--brand-ink);outline-offset:2px;border-radius:6px}
/* ♿ เคารพการตั้งค่า "ลดการเคลื่อนไหว" ของเครื่อง (เดิมไม่มีเลย) */
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
h1{font-size:23px;margin:0;font-weight:800;color:var(--ink-strong);letter-spacing:-.3px}
.sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:14px 0}
.c{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:15px 14px;box-shadow:0 2.5px 0 var(--paper1),0 5px 0 var(--paper2),0 11px 18px var(--shadow)}
.v{font-size:26px;font-weight:800;line-height:1.12;color:var(--brand-ink)}
.l{font-size:11.5px;color:var(--muted);margin-top:4px;font-weight:600}
h2{font-size:16px;color:var(--ink);margin:24px 2px 11px;font-weight:800;display:flex;align-items:center;gap:9px}
h2:before{content:"";width:5px;height:19px;background:linear-gradient(var(--brand),var(--brand-ink));border-radius:3px;display:inline-block;flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 13px;margin-bottom:12px;box-shadow:0 2.5px 0 var(--paper1),0 5px 0 var(--paper2),0 9px 16px var(--shadow)}
.rowitem{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 8px 10px 13px;margin-bottom:9px;font-size:14.5px;box-shadow:0 2px 0 var(--paper1),0 5px 10px var(--shadow);min-height:var(--tap)}
.rowitem .grow{flex:1;min-width:0}
.rowitem .t{overflow-wrap:anywhere;font-weight:600;color:var(--ink)}
.rowitem .m{font-size:11.5px;color:var(--muted);margin-top:3px}
/* 👆 ปุ่มทุกตัวต้องกดโดนอย่างน้อย 44×44 — เดิมปุ่มลบ 23×27px นั่งติดปุ่มนาฬิกา กดพลาดง่ายมาก */
.btn{background:var(--brand-ink);color:#fff;border:none;border-radius:11px;padding:10px 15px;font-size:14.5px;font-weight:700;font-family:inherit;box-shadow:0 3px 9px rgba(201,42,94,.26);min-height:var(--tap)}
.btn:active{opacity:.85}
.btn.ghost{background:var(--brand-soft);color:var(--brand-ink);box-shadow:none}
.btn.warn{background:#FDECEF;color:#B3261E;border:1px solid #F0AFB6;box-shadow:none}
@media (prefers-color-scheme:dark){.btn{color:#2A0A16}.btn.warn{background:#3A1F22;color:#FF9E96;border-color:#5A2E31}}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:10px;min-height:40px}
.ic{background:none;border:none;font-size:19px;color:var(--muted);min-width:var(--tap);min-height:var(--tap);display:inline-flex;align-items:center;justify-content:center;flex:none;border-radius:10px}
.ic:active{background:var(--pill-bg)}
.ic.danger{color:var(--neg)}
/* กล่องติ๊กงาน: กรอบที่เห็น 24px แต่พื้นที่กดจริง 44px (padding เป็นตัวขยาย ไม่ดันหน้าเบี้ยว) */
.chk{width:var(--tap);height:var(--tap);padding:10px;border:none;background:none;flex:none;display:flex;align-items:center;justify-content:center;color:var(--pos)}
.chk:before{content:"";width:24px;height:24px;border-radius:7px;border:2px solid var(--pos);display:block}
.chk.done:before{content:"✓";display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800}
input,select,textarea{width:100%;background:var(--field);border:1px solid var(--brand-line);border-radius:11px;color:var(--ink);padding:11px 12px;font-size:16px;font-family:inherit;margin-top:5px;min-height:var(--tap)}
/* font-size:16px บน input = iOS ไม่ซูมหน้าเองตอนโฟกัส (เดิม 15px ทำให้หน้าเด้งซูมทุกครั้งที่พิมพ์) */
textarea{min-height:96px;resize:vertical;line-height:1.6}
label.f{display:block;font-size:12px;color:var(--muted);margin-top:13px;font-weight:600}
.seg{display:flex;gap:8px;margin-top:6px}
.seg button{flex:1;background:var(--field);border:1px solid var(--brand-line);color:var(--ink);border-radius:11px;padding:11px 4px;font-size:14px;font-family:inherit;min-height:var(--tap)}
.seg button.on{background:var(--brand-ink);border-color:var(--brand-ink);color:#fff;font-weight:700}
@media (prefers-color-scheme:dark){.seg button.on{color:#2A0A16}}
.moods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.moods button{background:var(--field);border:1px solid var(--brand-line);border-radius:13px;padding:10px 2px;font-family:inherit;color:var(--ink);font-size:12px;min-height:60px}
.moods button .e{font-size:24px;display:block}
.moods button.on{border-color:#B07A00;background:#FFF6E2;color:#4A3400}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:8px 0;background:var(--line)}
.bar span{display:block;height:100%}
.pill{display:inline-block;font-size:11px;padding:2px 10px;border-radius:999px;background:var(--pill-bg);color:var(--muted);margin-left:6px;vertical-align:middle;font-weight:600}
.safety{background:#FFF1F4;border:1px solid #F3C0D0;border-radius:16px;padding:14px;margin-bottom:10px;font-size:13.5px;line-height:1.6;color:#3A3A44}
.safety a{color:#B3175A;font-weight:700}
.err{text-align:center;color:var(--muted);padding:60px 20px;font-size:15px;line-height:1.9}
.empty{color:var(--muted);font-size:13px;padding:8px 2px}
.gh{font-size:12.5px;color:var(--muted);margin:14px 4px 7px;font-weight:700}
.add{background:var(--surface);border:1.5px dashed var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.add .at{font-weight:800;color:var(--brand-ink);font-size:14.5px;margin-bottom:4px}
.nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 3px 0 var(--paper1),0 6px 0 var(--paper2),0 12px 24px var(--shadow);z-index:8;max-width:560px;margin:0 auto}
.nav button{flex:1;background:none;border:none;color:var(--muted);font-family:inherit;font-size:11px;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;min-height:56px}
.nav button .ne{font-size:20px}
.nav button.on{color:var(--brand-ink);font-weight:800}
.nav button.on .ne{transform:translateY(-1px)}
#toast{position:fixed;left:12px;right:12px;bottom:calc(92px + env(safe-area-inset-bottom));background:var(--ink-strong);color:var(--bg);padding:12px 14px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;transform:translateY(8px);z-index:12;box-shadow:0 6px 22px rgba(0,0,0,.22);display:flex;align-items:center;gap:10px;max-width:520px;margin:0 auto}
#toast.show{opacity:1;transform:none;pointer-events:auto}
#toast .tmsg{flex:1;min-width:0}
/* ↩️ ปุ่มเลิกทำในแถบแจ้งเตือน — ตัวนี้แหละที่มาแทน confirm() ทั้ง 8 จุด */
#toast .tundo{background:var(--brand);color:#2A0A16;border:none;border-radius:9px;padding:8px 14px;font-family:inherit;font-size:13.5px;font-weight:800;flex:none;min-height:40px}
.foot{color:var(--muted);font-size:11px;text-align:center;margin:22px 0 4px}
.plan{float:right;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:11px;font-weight:700;padding:6px 11px;border-radius:999px;margin-top:2px;min-height:32px;display:inline-flex;align-items:center}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:15px 0}
.st{background:var(--surface);border-radius:18px;padding:13px;box-shadow:0 4px 15px var(--shadow);display:flex;align-items:center;gap:11px;min-height:var(--tap);border:1px solid var(--line)}
.st .ico{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.st .big{font-size:21px;font-weight:800;line-height:1}
.st .cap{font-size:11px;color:var(--muted);margin-top:3px}
.ct{font-size:15px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:7px;margin-bottom:8px}
.ct .more{margin-left:auto;font-size:11.5px;color:var(--brand-ink);font-weight:700}
.don{display:flex;align-items:center;gap:15px}
.leg{font-size:12.5px;flex:1}
.leg>div{display:flex;align-items:center;gap:7px;margin:7px 0}
.leg b{margin-left:auto}
.dot{width:11px;height:11px;border-radius:3px;flex:none}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead .mo{font-size:15px;font-weight:800}
.nav2{width:var(--tap);height:var(--tap);border-radius:12px;background:var(--brand-soft);color:var(--brand-ink);border:none;font-family:inherit;font-size:17px;font-weight:700;flex:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal .wd{font-size:11px;color:var(--muted);font-weight:700;padding-bottom:3px}
.cal .d{aspect-ratio:1;min-height:40px;display:flex;align-items:center;justify-content:center;font-size:13.5px;border-radius:11px;position:relative;color:var(--ink);border:none;background:none;font-family:inherit}
.cal .d.today{background:var(--brand-ink);color:#fff;font-weight:800;box-shadow:0 3px 9px rgba(201,42,94,.34)}
.cal .d.sel{outline:2px solid var(--brand-ink);outline-offset:-2px;font-weight:800}
.cal .d .ev{width:5px;height:5px;border-radius:50%;background:var(--brand-ink);position:absolute;bottom:5px;left:50%;transform:translateX(-50%)}
.cal .d.today .ev{background:#fff}
.cal .d.mut{color:transparent;pointer-events:none}
.appt{display:flex;align-items:center;gap:11px;padding:8px 0;border-top:1px solid var(--line2);min-height:var(--tap)}
.appt .tm{font-size:12px;font-weight:800;color:var(--brand-ink);width:54px;flex:none}
.appt .tt{font-size:14px;font-weight:600}
.task{display:flex;align-items:center;gap:8px;padding:4px 0;border-top:1px solid var(--line2);min-height:var(--tap)}
.task .tx{font-size:14.5px;font-weight:600;flex:1;overflow-wrap:anywhere}
.badge{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;flex:none}
.b-late{background:#FDE7EA;color:#A5231C}
.b-todo{background:#E7F6EC;color:#12662C}
.b-soon{background:#FFF3DC;color:#7A5200}
@media (prefers-color-scheme:dark){
  .b-late{background:#3A1F22;color:#FF9E96}.b-todo{background:#17321F;color:#7FE29A}.b-soon{background:#332818;color:#F5C462}
  .safety{background:#33202A;border-color:#5A3543;color:#F0E2E8}.safety a{color:#FF9FBB}
  .moods button.on{background:#3A3018;border-color:#B08A2E;color:#F5DFA8}
}
.spin{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--brand);border-radius:50%;margin:0 auto 14px;animation:sp .8s linear infinite}
.ldr{min-height:86vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.ldr img{width:112px;animation:bnc .5s ease-in-out infinite alternate}
@keyframes bnc{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-18px) rotate(4deg)}}
.ldrsh{width:64px;height:10px;border-radius:50%;background:rgba(232,119,155,.18);margin-top:-12px;animation:shd .5s ease-in-out infinite alternate}
@keyframes shd{from{transform:scaleX(1);opacity:.9}to{transform:scaleX(.55);opacity:.4}}
.ldrbar{width:200px;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.ldrbar i{display:block;height:100%;width:45%;background:linear-gradient(90deg,#F4A9C0,var(--brand));border-radius:99px;animation:runb 1.1s ease-in-out infinite}
@keyframes runb{0%{margin-left:-45%}100%{margin-left:100%}}
.ldrtx{font-size:13.5px;color:var(--muted)}
.ik{vertical-align:-3px}
.ne .ik{display:block;margin:2px auto 3px}
@keyframes sp{to{transform:rotate(360deg)}}
/* 👁️ ข้อความสำหรับ screen reader อย่างเดียว (ปุ่มไอคอนล้วนต้องมีชื่อ ไม่งั้นอ่านออกมาว่า "ปุ่ม" เฉยๆ) */
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* ✏️ แผงแก้ไขในแถว (งาน/นัด/เงิน) — เดิมแก้อะไรไม่ได้เลย ต้องลบทิ้งแล้วพิมพ์ใหม่ในแชต */
.edit{background:var(--field);border:1px solid var(--brand-line);border-radius:12px;padding:11px;margin:6px 0 10px}
.edit .row2{display:flex;gap:8px}
.edit .row2>*{flex:1}
.edit input,.edit select{margin-top:4px}
.eact{display:flex;gap:8px;margin-top:10px}
.eact .btn{flex:1}
/* 🎫 Support Center */
.tk{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:9px;box-shadow:0 2px 8px var(--shadow)}
.tk .th{display:flex;align-items:center;gap:8px;font-weight:700}
.tk .ts{font-size:11.5px;color:var(--muted);margin-top:4px}
.msg{border-radius:14px;padding:10px 13px;margin:8px 0;font-size:14px;line-height:1.6;max-width:86%;overflow-wrap:anywhere}
.msg.u{background:var(--brand-soft);color:var(--ink);margin-left:auto}
.msg.s{background:var(--field);border:1px solid var(--line);color:var(--ink)}
.msg .mt{font-size:10.5px;color:var(--muted);margin-top:5px}
.msg img{max-width:100%;border-radius:9px;margin-top:7px;display:block}
.att{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.att .thumb{position:relative;width:64px;height:64px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.att .thumb img{width:100%;height:100%;object-fit:cover}
.att .thumb button{position:absolute;top:0;right:0;background:rgba(0,0,0,.6);color:#fff;border:none;width:24px;height:24px;font-size:14px;border-radius:0 0 0 8px;min-width:24px;min-height:24px}
/* 🔋 การ์ดฮีโร่ทางเข้าห้องพักใจ — ใหญ่ เด่น ชวนกด */
.hlhero{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px 18px 20px;margin-top:12px;text-align:center;cursor:pointer;box-shadow:0 2.5px 0 var(--paper1),0 5px 0 var(--paper2),0 11px 18px var(--shadow)}
.hlhero:before{content:"";position:absolute;top:-70px;left:50%;transform:translateX(-50%);width:280px;height:280px;background:radial-gradient(circle,rgba(252,224,234,.65),transparent 65%);pointer-events:none}
.hlhero img{width:104px;position:relative;animation:hlfloat 2.6s ease-in-out infinite}

/* ⚠️ กล่องยืนยันสำหรับของที่ "ลบแล้วกู้ไม่ได้จริงๆ" (ไฟล์ในคลัง / ลบทั้งบัญชี PDPA)

   แต่ confirm() ของเบราว์เซอร์ก็ใช้ไม่ได้: คนกด "ตกลง" อัตโนมัติโดยไม่อ่าน

   ตัวนี้บังคับให้ "พิมพ์คำยืนยัน" ถ้าเรื่องใหญ่ = ต้องอ่านถึงจะผ่านได้จริง */
function dlg(o){
  return new Promise(function(res){
    var w=document.createElement("div");
    w.setAttribute("role","dialog");w.setAttribute("aria-modal","true");w.setAttribute("aria-label",o.title);
    w.style.cssText="position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px";
    var need=o.typeWord||"";
    w.innerHTML='<div style="background:var(--surface);color:var(--ink);border-radius:18px;padding:20px;max-width:400px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3)">'
      +'<div style="font-size:17px;font-weight:800">'+esc(o.title)+'</div>'
      +'<div style="font-size:14px;line-height:1.65;color:var(--muted);margin-top:9px">'+o.body+'</div>'
      +(need?'<label class="f" for="dlgin">พิมพ์คำว่า <b style="color:var(--neg)">'+esc(need)+'</b> เพื่อยืนยัน</label><input id="dlgin" autocomplete="off" autocapitalize="off">':'')
      +'<div class="eact"><button class="btn warn" id="dlgok"'+(need?" disabled":"")+'>'+esc(o.okText||"ยืนยัน")+'</button>'
      +'<button class="btn ghost" id="dlgno">ไม่ลบแล้ว</button></div></div>';
    document.body.appendChild(w);
    var ok=w.querySelector("#dlgok"),no=w.querySelector("#dlgno"),inp=w.querySelector("#dlgin");
    function close(v){document.body.removeChild(w);document.removeEventListener("keydown",esckey);res(v)}
    function esckey(e){if(e.key==="Escape")close(false)}
    document.addEventListener("keydown",esckey);
    if(inp){inp.oninput=function(){ok.disabled=inp.value.trim()!==need};setTimeout(function(){inp.focus()},50)}
    else{setTimeout(function(){no.focus()},50)}
    ok.onclick=function(){if(!ok.disabled)close(true)};
    no.onclick=function(){close(false)};
    w.onclick=function(e){if(e.target===w)close(false)};
  });
}

/* ↩️ แถบแจ้งเตือนพร้อมปุ่ม "เลิกทำ" — ตัวนี้มาแทน confirm() ทั้ง 8 จุด
   ทำไม confirm() ถึงไม่ช่วยจริง: มันขวางคนที่ "ตั้งใจลบ" แต่ช่วยคนที่ "เผลอลบ" ไม่ได้เลย
   (กดตกลงโดยไม่อ่านคือพฤติกรรมปกติของคน) พอกดผ่านแล้วก็จบ กู้ไม่ได้
   ของใหม่: ลบไปเลยไม่ต้องถาม แต่ให้ทางกลับ 7 วิ + ถังขยะ 30 วันข้างหลังอีกชั้น */
function tshow(m,undoFn,ms){
  var t=$("#toast");if(!t)return;
  if(TOASTT){clearTimeout(TOASTT);TOASTT=null}
  t.innerHTML='<span class="tmsg"></span>';
  t.firstChild.textContent=m;
  if(undoFn){
    var b=document.createElement("button");
    b.className="tundo";b.type="button";b.textContent="↩️ เลิกทำ";
    b.onclick=function(){if(TOASTT){clearTimeout(TOASTT);TOASTT=null}t.className="";undoFn()};
    t.appendChild(b);
  }
  t.className="show";
  TOASTT=setTimeout(function(){t.className="";TOASTT=null},ms||(undoFn?7000:1700));
}

/* 🔑 ID token ของ LIFF อายุแค่ ~1 ชม. — คนเปิดซ้ำหลังจากนั้นได้ token ตาย → API 401 ทั้งหน้า
   (เจอจริง 2026-07-04 จาก function_edge_logs) ทางแก้: เช็ค exp ก่อนใช้ + 401 → login ใหม่อัตโนมัติ 1 ครั้ง */
function tokenExpired(t){try{var b=t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");while(b.length%4)b+="=";
  var p=JSON.parse(atob(b));return !p.exp||p.exp*1000<Date.now()+60000}catch(e){return false}}
/* ⚠️ liff.login() ใช้ใน LIFF browser (ในแอป LINE) ไม่ได้ — throw ทันที (เจอจริง: หน้าโหลด 200 แต่ไม่มี POST เลย)
   ในแอปต้อง logout (ล้าง token เก่า) แล้วเปิดตัวเองใหม่ผ่าน permalink → init รอบใหม่ auto-login ได้ token สด
   guard ด้วย localStorage (sessionStorage ไม่รอดข้ามการเปิดใหม่) — ถ้าวนซ้ำใน 1 นาที = หยุด แจ้งผู้ใช้ */
function relogin(){
  try{var k=localStorage.getItem("yb_rl_t");
    if(k&&Date.now()-Number(k)<60000){$("#app").innerHTML=loginFailBox("เข้าสู่ระบบไม่สำเร็จ");return}
    localStorage.setItem("yb_rl_t",String(Date.now()))}catch(e){}
  try{liff.logout()}catch(e){}
  var st="";
  try{var qp=new URLSearchParams(location.search),tb=qp.get("tab"),af=qp.get("aff"),sv=qp.get("sel");
    var ls=qp.get("liff.state");if(ls){var lq=new URLSearchParams(ls.charAt(0)==="?"?ls.slice(1):ls);if(!tb)tb=lq.get("tab");if(!af)af=lq.get("aff");if(!sv)sv=lq.get("sel")}
    if(tb)st="?tab="+encodeURIComponent(tb);
    if(af)st+=(st?"&":"?")+"aff="+encodeURIComponent(af);
    if(sv)st+=(st?"&":"?")+"sel=1"}catch(e){}
  if(liff.isInClient&&liff.isInClient()){location.replace("https://liff.line.me/2010582556-jAUGKlnX"+st)}
  else{try{liff.login()}catch(e){location.reload()}}
}

async function api(action,payload){
  var r=await fetch("https://eeascfxgfmzlqvirjdua.supabase.co/functions/v1/webhook?api=1",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({idToken:IDT,action:action,payload:payload||{}})});
  if(r.status===401){relogin();throw new Error("กำลังต่ออายุการเข้าสู่ระบบ รอแป๊บนึงนะ...")}
  if(!r.ok){var er="";try{er=(await r.json()).error||""}catch(e){}throw new Error(er||("ผิดพลาด "+r.status))}
  return r.json();
}

async function ensureStory(){
  var s=DATA.story||{};
  if(s.loaded!==false)return;              /* true = โหลดแล้ว · 'ing' = กำลังโหลด · undefined = ข้อมูลรุ่นเก่า ปล่อยผ่าน */
  DATA.story.loaded="ing";                 /* กันยิงซ้ำตอนกดแท็บรัวๆ */
  try{
    var r=await api("me.story");
    DATA.story={facts:r.facts||[],files:r.files||[],folders:r.folders||[],nFacts:(r.facts||[]).length,nFiles:(r.files||[]).length,loaded:true};
  }catch(e){if(DATA.story)DATA.story.loaded=false}  /* พลาด = กดเข้าใหม่แล้วลองอีกได้ */
  if(TAB==="story")draw();
}

function wzHourSel(id,cur){
  var h='<select id="'+id+'" onchange="wzStash();wzPersist()"><option value="">— เลือกเวลา —</option>',q;
  for(q=0;q<24;q++){h+='<option value="'+q+'"'+(String(cur)===String(q)?" selected":"")+'>'+(q<10?"0":"")+q+':00 น.</option>'}
  return h+'</select>';
}

/* เก็บค่าช่องแฟ้มที่อยู่ในจอ wizard ลง DF ก่อนเปลี่ยนหน้า (DOM ชุดเดิมจะถูกทิ้ง) */
function dStash2(){
  if(!DF)dossInit();
  var m={d_call:"call_me",d_birth:"birth_date",d_ctry:"country",d_prov:"province",d_city:"city",
         d_org:"org_name",d_like:"likes"},k,e;
  for(k in m){e=$("#"+k);if(e)DF[m[k]]=e.value.trim()}
}
function wzStash(){
  var g=function(id){var e=$(id);return e?e.value.trim():null};
  var v;
  v=g("#wz_nm");if(v!==null)F_NM=v;
  v=g("#wz_ph");if(v!==null)F_PH=v;
  v=g("#wz_bz");if(v!==null)F_BZ=v;
  var a=$("#wz_ag");if(a)F_AG=a.value;
  var c=$("#wz_ac");if(c)F_AC=c.value;
  v=g("#wz_oc");if(v!==null)F_OC=v;
  var w=$("#wz_wk");if(w)F_WK=w.value;
  var s2=$("#wz_sl");if(s2)F_SL=s2.value;
}
async function wzSave(){
  wzStash();dStash2();
  var miss=wzMissing(3);
  if(miss.length){toast("ขอ "+miss[0]+" ก่อนนะ"+(miss.length>1?" (เหลืออีก "+(miss.length-1)+" ข้อ)":""));return}
  if(!F_NM){WZ=2;draw();toast("ใส่ชื่อให้เลขาเรียกหน่อยนะ");return}
  var btn=document.querySelector(".wznext");if(btn){btn.disabled=true;btn.textContent="กำลังบันทึก..."}
  try{
    /* 2 ก้อน: onboard.save = ยินยอม/สไตล์เลขา/ทดลอง Pro · profile.update = แฟ้มเจ้านาย
       ต้องเรียงลำดับนี้ เพราะ profile.update จดว่า "ตอบช่องไหนแล้ว" ทับของที่ onboard เขียนไว้ */
    await api("onboard.save",{display_name:F_NM,phone:F_PH,age_range:F_AG,wanted_feature:F_WF,acq_channel:F_AC,
      business_story:F_BZ,character:CH,secretary_name:SNAME,marketing_ok:WZ_MK,
      occupation:F_OC,wanted_features:F_WFS,wake_hour:F_WK,sleep_hour:F_SL});
    /* 🆕 คนเก่าใช้ฟอร์มเดิมที่ไม่มีช่องแฟ้ม — ยิง profile.update ไปก็มีแต่ค่าว่าง
       แถมจะไปจดว่า "ตอบช่องนี้แล้ว" ทั้งที่ไม่เคยเห็นคำถาม ทำให้ % ในแฟ้มเพี้ยนตอนเปิดให้ทุกคน */
    if(wzNewUx())await api("profile.update",{
      call_me:DF.call_me||"",birth_date:DF.birth_date||"",country:DF.country||"",
      province:DF.province||"",city:DF.city||"",org_name:DF.org_name||"",occupation:F_OC||"",
      reply_style:DF.reply_style||"",marital_status:DF.marital_status||"",default_scope:DF.default_scope||"",
      selfcare:DF.selfcare||[],likes:DF.likes||"",
      renudge:(DF.renudge===true||DF.renudge==="true")
    });
    if(DATA&&DATA.profile){DATA.profile.display_name=F_NM;DATA.profile.character=CH}
    DF=null;
    TI=0;WZ=4;draw();window.scrollTo(0,0);
  }catch(e){toast(e.message||"บันทึกไม่สำเร็จ ลองใหม่อีกที");if(btn){btn.disabled=false;btn.textContent="เสร็จแล้ว เริ่มใช้เลย ›"}}
}

var CALM=0,SELISO=null;
var THMON=["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
function todayBKK(){try{return new Date().toLocaleDateString("en-CA",{timeZone:TZ()})}catch(e){return new Date().toISOString().slice(0,10)}}
function bkkYMD(iso){try{return new Date(iso).toLocaleDateString("en-CA",{timeZone:TZ()})}catch(e){return (""+iso).slice(0,10)}}
function thToday(){try{return new Date().toLocaleDateString("th-TH",{day:"numeric",month:"long",timeZone:TZ()})}catch(e){return ""}}
function thDate(iso){try{return new Date(iso+"T00:00:00").toLocaleDateString("th-TH",{weekday:"short",day:"numeric",month:"short"})}catch(e){return iso}}
function thMonth(off){var d=new Date();d.setDate(1);d.setMonth(d.getMonth()+off);return THMON[d.getMonth()]+" "+d.getFullYear()} // setDate(1) ก่อน: วันที่ 29-31 บวกเดือนแล้วล้น หัวเดือนเพี้ยน
function stat(bg,ic,col,val,cap,tab){return '<div class="st" onclick="go(\''+tab+'\')" style="cursor:pointer"><div class="ico" style="background:'+bg+';color:'+col+'">'+ic+'</div><div><div class="big" style="color:#23232B">'+num(val)+'</div><div class="cap">'+cap+'</div></div></div>'}
function donutSvg(income,expense){
  var tot=(income||0)+(expense||0),c=327,inc=tot>0?income/tot*c:0,exp=tot>0?expense/tot*c:0;
  var s='<svg width="122" height="122" viewBox="0 0 126 126" style="flex:none">';
  s+='<circle cx="63" cy="63" r="52" fill="none" stroke="#EDEDF2" stroke-width="16"/>';
  if(tot>0){
    s+='<circle cx="63" cy="63" r="52" fill="none" stroke="#22C55E" stroke-width="16" stroke-dasharray="'+inc+' '+(c-inc)+'" transform="rotate(-90 63 63)"/>';
    s+='<circle cx="63" cy="63" r="52" fill="none" stroke="#FB7185" stroke-width="16" stroke-dasharray="'+exp+' '+(c-exp)+'" stroke-dashoffset="'+(-inc)+'" transform="rotate(-90 63 63)"/>';
  }
  s+='<text x="63" y="58" text-anchor="middle" font-size="11" fill="#6F6F78">สุทธิ</text>';
  s+='<text x="63" y="81" text-anchor="middle" font-size="18" font-weight="800" fill="#E0466E">'+num((income||0)-(expense||0))+'</text></svg>';
  return s;
}
function calMonth(){
  var now=new Date(),base=new Date(now.getFullYear(),now.getMonth()+CALM,1);
  var y=base.getFullYear(),mo=base.getMonth(),first=new Date(y,mo,1).getDay(),days=new Date(y,mo+1,0).getDate();
  var ev={},rem=(DATA.reminders||[]);
  for(var i=0;i<rem.length;i++){var ds=bkkYMD(rem[i].remind_at).split("-");if(+ds[0]===y&&+ds[1]===mo+1){ev[+ds[2]]=1}}
  var tp=todayBKK().split("-"),isCurM=(+tp[0]===y&&+tp[1]===mo+1),td=+tp[2];
  var h='<div class="calhead"><button class="nav2" onclick="calShift(-1)">‹</button><div class="mo">'+THMON[mo]+' '+y+'</div><button class="nav2" onclick="calShift(1)">›</button></div><div class="cal">';
  var wd=["อา","จ","อ","พ","พฤ","ศ","ส"];for(var w=0;w<7;w++){h+='<div class="wd">'+wd[w]+'</div>'}
  for(var b=0;b<first;b++){h+='<div class="d mut"></div>'}
  for(var dd=1;dd<=days;dd++){h+='<div class="d'+(isCurM&&dd===td?" today":"")+'" onclick="pickDay('+y+','+mo+','+dd+')">'+dd+(ev[dd]?'<span class="ev"></span>':'')+'</div>'}
  return h+'</div>';
}
function calShift(n){CALM+=n;if(CALM===0){SELISO=null}else{var b=new Date();b.setDate(1);b.setMonth(b.getMonth()+CALM);SELISO=b.getFullYear()+"-"+("0"+(b.getMonth()+1)).slice(-2)+"-01"}draw()}
function pickDay(y,mo,dd){SELISO=y+"-"+("0"+(mo+1)).slice(-2)+"-"+("0"+dd).slice(-2);draw()}
function apptsList(iso){
  var rem=(DATA.reminders||[]).filter(function(r){return bkkYMD(r.remind_at)===iso});
  rem.sort(function(a,b){return (""+a.remind_at)<(""+b.remind_at)?-1:1});
  if(!rem.length){return '<div class="empty" style="padding:10px 2px">ไม่มีนัดวันนี้ 🎉</div>'}
  var h='';for(var i=0;i<rem.length;i++){var r=rem[i];var tm=r.all_day?"ทั้งวัน":new Date(r.remind_at).toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit",timeZone:TZ()});
    h+='<div class="appt"><div class="tm">'+tm+'</div><div class="tt">'+esc(r.reminder_text)+'</div></div>';}
  return h;
}

function dayKey(d){try{return new Date(d).toLocaleDateString("en-CA",{timeZone:TZ()})}catch(e){return String(d).slice(0,10)}}
function addDays(ymd,n){var d=new Date(ymd+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
/* รวมงาน+นัดเป็นรายการเดียว แล้วแบ่งกอง: เลยกำหนด / วันนี้ / พรุ่งนี้ / สัปดาห์นี้ / ต่อไป / ไม่มีกำหนด */
function agenda(){
  var today=todayBKK(),tmr=addDays(today,1),wk=addDays(today,7),now=Date.now();
  var B={late:[],today:[],tmr:[],week:[],later:[],none:[]};
  (DATA.reminders||[]).forEach(function(r,ri){
    var k=dayKey(r.remind_at);
    // ri = ตำแหน่งใน DATA.reminders — edRem() ใช้ค้นตัวเดิมกลับ (แผงแก้ไขวาดลงกล่อง #rs<ri>)
    var it={type:"appt",id:r.id,idx:ri,text:r.reminder_text,at:r.remind_at,allDay:r.all_day,repeat:r.repeat,sort:Date.parse(r.remind_at)||0};
    if(Date.parse(r.remind_at)<now&&k<today)B.late.push(it);
    else if(k===today)B.today.push(it);
    else if(k===tmr)B.tmr.push(it);
    else if(k<wk)B.week.push(it);
    else B.later.push(it);
  });
  ((DATA.tasks&&DATA.tasks.open)||[]).forEach(function(t){
    var due=t.due_date?String(t.due_date).slice(0,10):null;
    /* ⚠️ ต้องพก task_text/priority/project ติดมาด้วย — ลิสต์ "งานที่ยังไม่ได้ตั้งกำหนด" (B.none)
     วาดด้วยตัววาดที่อ่าน t.task_text ตรงๆ ถ้าใส่แต่ t.text จะได้แถวเปล่าทั้งลิสต์
     (บอสแจ้ง 5 ส.ค.: เพิ่มงานใหม่แล้วมองไม่เห็นตัวหนังสือ — งานใหม่ไม่มีกำหนดจึงตกมาที่ B.none เสมอ) */
var it={type:"task",id:t.id,text:t.task_text,task_text:t.task_text,priority:t.priority,project:t.project,due:due,sort:due?Date.parse(due+"T23:59:59Z"):Infinity};
    if(!due)B.none.push(it);
    else if(due<today)B.late.push(it);
    else if(due===today)B.today.push(it);
    else if(due===tmr)B.tmr.push(it);
    else if(due<wk)B.week.push(it);
    else B.later.push(it);
  });
  ["late","today","tmr","week","later"].forEach(function(k){B[k].sort(function(a,b){return a.sort-b.sort})});
  return B;
}

/* ✏️ แก้นัดในที่ — ชื่อ + เวลา + ความถี่ · เดิมทำได้แค่ "เลื่อนเวลา" แก้ชื่อนัดไม่ได้เลย

function edRem(i){

  var REP=[["none","ไม่ซ้ำ"],["daily","ทุกวัน"],["weekdays","จ–ศ"],["weekly","ทุกสัปดาห์"],["monthly","ทุกเดือน"],["monthend","สิ้นเดือน"],["yearly","ทุกปี"]];
  var pro=mIsPro(),h='<div class="edit">';
  h+='<label class="f" for="rt'+i+'">ชื่อนัด</label><input id="rt'+i+'" maxlength="300" value="'+esc(r.reminder_text)+'">';
  h+='<label class="f" for="rd'+i+'">วันเวลา</label><input type="datetime-local" id="rd'+i+'" value="'+esc(lo)+'">';
  h+='<label class="f" for="rr'+i+'">เตือนซ้ำ'+(pro?"":" 🔒 Pro")+'</label><select id="rr'+i+'"'+(pro?"":" disabled")+'>';

  h+='</select>';
  if(!pro){h+='<div class="l" style="margin-top:5px">เตือนวนซ้ำอัตโนมัติอยู่ในแพ็ก Pro นะ</div>'}
  h+='<div class="eact"><button class="btn sm" onclick="edRemSave('+i+',\''+r.id+'\')">บันทึก</button>'
    +'<button class="btn sm ghost" onclick="edRem('+i+')">ยกเลิก</button></div></div>';
  el.innerHTML=h;
}
async function edRemSave(i,id){
  var tx=$("#rt"+i).value.trim(),val=$("#rd"+i).value,rp=$("#rr"+i);
  if(!tx){toast("ใส่ชื่อนัดด้วยนะ");return}
  if(!val){toast("เลือกวันเวลาก่อนนะ");return}
  var p={id:id,text:tx,remind_at:wallUtc(val.slice(0,10),val.slice(11,16)).toISOString()};
  if(rp&&!rp.disabled)p.repeat=rp.value;
  try{
    var r=await api("reminder.update",p);
    if(r&&r.ok===false){toast("แก้ไม่ได้ (นัดนี้อาจถูกเตือนไปแล้ว)");return}
    await reload();toast("แก้ให้แล้ว ✓");
  }catch(e){toast(e.message==="pro_only"?"เตือนวนซ้ำอยู่ในแพ็ก Pro นะ":(e.message||"แก้ไม่สำเร็จ"))}
}
/* ISO -> ค่าที่ใส่ใน input[type=datetime-local] ได้ (ตามโซนเวลาที่ลูกค้าตั้งไว้ ไม่ใช่ของเครื่อง) */
function localInput(iso){
  try{
    var s=new Date(iso).toLocaleString("sv-SE",{timeZone:TZ()}); // sv-SE ให้รูปแบบ YYYY-MM-DD HH:MM:SS
    return s.slice(0,10)+"T"+s.slice(11,16);
  }catch(e){return String(iso).slice(0,16)}
}
function delRem(id){delUndo("reminder.delete",id,"นัดนี้")}
function tgTask(id,done){act("task.toggle",{id:id,done:done},done?"เยี่ยม เสร็จอีกงาน! 🎉":"")}

/* ✏️ แก้งานในที่ (ข้อความ + กำหนดส่ง) — เดิมพิมพ์ผิดตัวเดียวต้องลบทิ้งแล้วพิมพ์ใหม่ในแชต
   ตาราง tasks มีคอลัมน์ due_date มาตลอด และหน้านี้ก็เอามาโชว์ badge "เลยกำหนด" อยู่ แต่ไม่เคยมีที่ให้ตั้ง */

    +'<div class="eact"><button class="btn sm" onclick="edTaskSave(\''+id+'\')">บันทึก</button>'

async function edTaskSave(id){

/* ☑️ เลือกหลายรายการ: ติ๊กสะสมใน TSEL แล้วยิง API รายตัวตอนกดยืนยัน (ใช้ endpoint เดิม ไม่แตะหลังบ้าน) */
function tSelStart(){TSEL=new Set();draw()}
function tSelEnd(){TSEL=null;draw()}
function tSelTg(id){if(!TSEL)return;id=String(id);if(TSEL.has(id)){TSEL.delete(id)}else{TSEL.add(id)}draw()}
async function tSelDo(del){
  if(!TSEL||!TSEL.size){toast("ติ๊กเลือกงานก่อนนะ");return}
  var n=TSEL.size,ids=Array.from(TSEL),ok=0,er="";
  // ลบหลายงานพร้อมกันไม่ต้องถามแล้ว — ทุกใบถูกถ่ายสำเนาลงถังขยะ กดเลิกทำได้ทันที
  /* 🐛 25 ก.ค.: เดิม catch(e){} กลืน error ทุกชนิด + ไม่เช็ค ok:false ที่ API ส่งกลับตอนปิดไม่ติด
     แล้วเด้ง "ปิด N งานแล้ว 🎉" ทุกกรณี — โทเค็นหมดอายุ/เน็ตหลุด/แถวไม่แมตช์ = ลูกค้าเห็นข้อความสำเร็จ
     ทั้งที่ไม่มีอะไรถูกปิดจริง แล้วงานยังค้างเหมือนเดิม (ตรงกับอาการ "กดเสร็จแล้วไม่หาย ปิดแอปเปิดใหม่ก็ยังอยู่")
     กฎที่ยึด: นับผลจริงทีละใบ แล้วพูดตามที่เกิดขึ้นจริงเสมอ — สำเร็จบางส่วนก็ต้องบอกว่าบางส่วน */
  for(var i=0;i<ids.length;i++){
    try{
      var rs=await api(del?"task.delete":"task.toggle",del?{id:ids[i]}:{id:ids[i],done:true});
      if(rs&&rs.ok===false){er=er||(del?"ลบไม่ติด":"ปิดไม่ติด")}else{ok++}
    }catch(e){er=er||(e&&e.message)||"ผิดพลาด"}
  }
  TSEL=null;await reload();
  if(!ok){toast(er||(del?"ลบไม่สำเร็จ ลองใหม่อีกที":"ปิดงานไม่สำเร็จ ลองใหม่อีกที"));return}
  var part=ok<n?(" ("+ok+"/"+n+" — ที่เหลือไม่สำเร็จ ลองใหม่อีกที)"):"";
  if(!del){toast("ปิด "+ok+" งานแล้ว 🎉"+part);return}
  tshow("ลบ "+ok+" งานแล้ว"+part,async function(){
    try{
      var tr=await api("trash.list",{});
      var back=(tr.rows||[]).filter(function(r){return r.table==="tasks"}).slice(0,ok);
      for(var k=0;k<back.length;k++){await api("trash.restore",{id:back[k].id})}
      await reload();toast("เอา "+back.length+" งานกลับมาแล้ว 🤍");
    }catch(e){toast("กู้คืนไม่ได้ ลองดูใน ถังขยะ")}
  });
}

    +'<div><label class="f" for="mf_date">วันที่</label><input id="mf_date" type="date" value="'+esc(pre.transaction_date?String(pre.transaction_date).slice(0,10):todayBKK())+'"></div></div>';

  h+='<label class="f" for="mf_note">รายละเอียด</label><input id="mf_note" maxlength="200" value="'+esc(pre.note||"")+'" placeholder="ไม่ใส่ก็ได้">';

function mPick(el,which){

  else{

function fileRow(d){var nm=d.title||d.file_name||"ไฟล์";
  return '<div class="rowitem"><div style="font-size:20px">'+docIcon(d.doc_type)+'</div><div class="grow"><div class="t">'+esc(nm)+'</div><div class="m">'+(d.doc_date?esc(d.doc_date)+' · ':'')+fdate(d.created_at)+'</div></div><button class="btn sm" onclick="openFile(\''+d.id+'\')">เปิด</button><button class="ic" aria-label="ย้ายโฟลเดอร์" onclick="moveFile(\''+d.id+'\')">'+icn("folder",15)+'</button><button class="ic danger" aria-label="ลบไฟล์นี้" onclick="delFile(\''+d.id+'\')">'+icn("trash",15)+'</button></div>';
}
function toggleFolder(id){var e=$("#fld_"+id),a=$("#fa_"+id);if(!e){return}var op=e.style.display==="none";e.style.display=op?"block":"none";if(a){a.textContent=op?"▾":"▸"}}
/* 🗂 จัดการโฟลเดอร์ (บอสสั่ง 26 ส.ค.) */
function askText(title,ph,val){return new Promise(function(res){
  var w=document.createElement("div");w.setAttribute("role","dialog");w.setAttribute("aria-modal","true");
  w.style.cssText="position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px";
  w.innerHTML='<div style="background:var(--surface);color:var(--ink);border-radius:18px;padding:20px;max-width:400px;width:100%">'
    +'<div style="font-size:17px;font-weight:800">'+esc(title)+'</div>'
    +'<input id="atin" placeholder="'+esc(ph||"")+'" value="'+esc(val||"")+'" maxlength="20" autocomplete="off">'
    +'<div class="eact"><button class="btn" id="atok">ตกลง</button><button class="btn ghost" id="atno">ยกเลิก</button></div></div>';
  document.body.appendChild(w);
  var inp=w.querySelector("#atin");
  function close(v){document.body.removeChild(w);res(v)}
  w.querySelector("#atok").onclick=function(){var v=inp.value.trim();if(v){close(v)}else{inp.focus()}};
  w.querySelector("#atno").onclick=function(){close(null)};
  setTimeout(function(){inp.focus()},50)})}
function pickFolder(){return new Promise(function(res){
  var fs=((DATA.story&&DATA.story.folders)||[]);
  var w=document.createElement("div");w.setAttribute("role","dialog");w.setAttribute("aria-modal","true");
  w.style.cssText="position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px";
  var b='<div style="background:var(--surface);color:var(--ink);border-radius:18px;padding:20px;max-width:400px;width:100%;max-height:70vh;overflow:auto">'
    +'<div style="font-size:17px;font-weight:800">ย้ายไปโฟลเดอร์ไหน?</div><div style="margin-top:10px">';
  for(var i=0;i<fs.length;i++){b+='<button class="btn ghost" style="width:100%;margin-top:8px;text-align:left" data-fid="'+fs[i].id+'">📁 '+esc(fs[i].name)+'</button>'}
  b+='<button class="btn ghost" style="width:100%;margin-top:8px;text-align:left" data-fid="_none">📎 เอาออกจากโฟลเดอร์</button>'
    +'<button class="btn ghost" style="width:100%;margin-top:8px;text-align:left" data-fid="_new">➕ โฟลเดอร์ใหม่…</button>'
    +'<button class="btn warn" style="width:100%;margin-top:12px" data-fid="_x">ยกเลิก</button></div></div>';
  w.innerHTML=b;document.body.appendChild(w);
  w.onclick=function(e){var t=e.target.closest("[data-fid]");if(!t){return}
    document.body.removeChild(w);var v=t.getAttribute("data-fid");
    res(v==="_x"?undefined:v==="_none"?null:v)}})}
async function addFolder(){var nm=await askText("สร้างโฟลเดอร์ใหม่","เช่น ใบรับประกัน");if(!nm){return}
  await act("folder.create",{name:nm},"สร้างโฟลเดอร์แล้ว 📁")}
async function renFolder(id){var fs=((DATA.story&&DATA.story.folders)||[]),f=null;
  for(var i=0;i<fs.length;i++){if(String(fs[i].id)===String(id)){f=fs[i];break}}
  var nm=await askText("แก้ชื่อโฟลเดอร์","ชื่อใหม่",f?f.name:"");if(!nm){return}
  await act("folder.rename",{id:id,name:nm},"แก้ชื่อแล้ว ✏️")}
async function delFolder(id){var ok=await dlg({title:"ลบโฟลเดอร์นี้?",okText:"ลบโฟลเดอร์",
    body:"ไฟล์ข้างในไม่หายนะ — จะถูกย้ายออกมาไว้นอกโฟลเดอร์ให้เอง"});
  if(!ok){return}await act("folder.delete",{id:id},"ลบโฟลเดอร์แล้ว 🗑")}
async function moveFile(id){var fid=await pickFolder();if(fid===undefined){return}
  if(fid==="_new"){var nm=await askText("โฟลเดอร์ใหม่","เช่น สัญญา");if(!nm){return}
    var nf=await api("folder.create",{name:nm});if(!nf||!nf.id){toast("สร้างไม่สำเร็จ");return}fid=nf.id}
  await act("file.move",{id:id,folder_id:fid},"ย้ายแล้ว 📁")}
function reportFact(id){
  var arr=(DATA.story&&DATA.story.facts)||[],f=null;
  for(var i=0;i<arr.length;i++){if(String(arr[i].id)===String(id)){f=arr[i];break}}
  if(!f){return}
  // ไม่ต้องถามยืนยัน — การกดนี้แค่พาไปพิมพ์ในแชต ไม่ได้ทำลายอะไร (confirm() ที่ขวางของไม่อันตราย = สร้างนิสัยกดผ่านโดยไม่อ่าน)
  try{
    if(liff.isInClient()){liff.sendMessages([{type:"text",text:"ขอแก้ความจำ: «"+f.fact_text+"»"}]);liff.closeWindow()}
    else{toast("เปิดในแอป LINE เพื่อแจ้งแก้ไขนะ")}
  }catch(e){try{liff.closeWindow()}catch(_e){toast("พิมพ์บอกเลขาในแชตได้เลยว่าตรงไหนไม่ถูก")}}
}
function delFact(id){delUndo("fact.delete",id,"ความจำนี้")}
/* 📁 ไฟล์ = ลบแล้วกู้ไม่ได้จริง (ตัวไฟล์ในที่เก็บถูกลบไปด้วย ไม่ใช่แค่แถวใน DB)
   จึงเป็น 1 ใน 2 ที่ยังต้องถามก่อน — แต่ถามด้วยกล่องของเราที่บอกผลตรงๆ ไม่ใช่ confirm() ของเบราว์เซอร์ */
async function delFile(id){
  var nm="ไฟล์นี้",arr=(DATA.story&&DATA.story.files)||[];
  for(var i=0;i<arr.length;i++){if(String(arr[i].id)===String(id)){nm=arr[i].title||arr[i].file_name||nm;break}}
  var ok=await dlg({title:"ลบไฟล์ออกจากคลัง?",okText:"ลบไฟล์",
    body:"<b>"+esc(nm)+"</b><br><br>ไฟล์นี้จะถูกลบออกจากที่เก็บจริงๆ <b>กู้คืนไม่ได้</b> ต่างจากงาน/นัด/รายการเงิน ที่ลบแล้วยังอยู่ในถังขยะ 30 วัน"});
  if(ok)act("file.delete",{id:id},"ลบไฟล์แล้ว");
}
async function openFile(id){
  try{var res=await api("file.url",{id:id});
    if(res&&res.url){if(liff.isInClient()){liff.openWindow({url:res.url,external:true})}else{window.open(res.url,"_blank")}}
    else{toast("เปิดไฟล์ไม่ได้")}
  }catch(e){toast(e.message||"ผิดพลาด")}
}

function moodTrend(){
  var ms=(DATA.mood||[]).filter(function(m){var t=new Date(m.created_at).getTime();return Date.now()-t<14*864e5});
  if(!ms.length){return ""}
  var cnt={},tot=0;
  for(var i=0;i<ms.length;i++){cnt[ms[i].mood]=(cnt[ms[i].mood]||0)+1;tot++}
  var bar='<div class="bar">',leg="";
  for(var key in MOOD_TH){if(cnt[key]){var pct=Math.round(cnt[key]/tot*100);bar+='<span style="width:'+pct+'%;background:'+MOOD_TH[key][2]+'"></span>';leg+='<span class="pill">'+moodFace(key,14)+' '+cnt[key]+'</span>'}}
  bar+='</div>';
  return '<h2>อารมณ์ 14 วันล่าสุด ('+tot+' ครั้ง)</h2><div class="card">'+bar+'<div style="margin-top:6px">'+leg+'</div></div>';
}
function pickMood(el,key){MSEL=key;var bs=document.querySelectorAll("#moodpick button");for(var i=0;i<bs.length;i++){bs[i].className=""}el.className="on"}
async function saveMood(){

  var note=$("#mnote")?$("#mnote").value:"";

  if(ok)MSEL=null;
}

/* แนบรูป: ย่อก่อนส่งเสมอ — รูปจากมือถือใบละ 3-5MB ส่งดิบไป 3 ใบ = คำขอ 15MB เน็ตมือถือไม่รอด */
function hAtt(inp){
  var fs=Array.prototype.slice.call(inp.files||[]).slice(0,3-HATT.length);
  fs.forEach(function(f){
    var rd=new FileReader();
    rd.onload=function(){
      var im=new Image();
      im.onload=function(){
        var mx=1280,w=im.width,hh=im.height;
        if(w>mx||hh>mx){var sc=mx/Math.max(w,hh);w=Math.round(w*sc);hh=Math.round(hh*sc)}
        var cv=document.createElement("canvas");cv.width=w;cv.height=hh;
        cv.getContext("2d").drawImage(im,0,0,w,hh);
        HATT.push(cv.toDataURL("image/jpeg",0.82));
        hAttDraw();
      };
      im.src=rd.result;
    };
    rd.readAsDataURL(f);
  });
  inp.value="";
}
function hAttDraw(){
  var b=$("#hp_att");if(!b)return;
  var h="";
  for(var i=0;i<HATT.length;i++){h+='<div class="thumb"><img src="'+HATT[i]+'" alt="รูปที่แนบ '+(i+1)+'"><button type="button" aria-label="เอารูปที่ '+(i+1)+' ออก" onclick="hAttDel('+i+')">×</button></div>'}
  b.innerHTML=h;
}
function hAttDel(i){HATT.splice(i,1);hAttDraw()}
async function hSend(btn){
  var body=$("#hp_body").value.trim(),cat=$("#hp_cat").value;
  if(body.length<5){toast("เล่าให้ฟังอีกนิดนะ จะได้ช่วยได้ตรงจุด");return}
  if(btn){btn.disabled=true;btn.textContent="กำลังส่ง..."}
  try{
    var r=await api("support.create",{category:cat,body:body,subject:body.slice(0,80),attachments:HATT,from:"liff"});
    if(r&&r.ok===false){toast("ส่งไม่สำเร็จ ลองใหม่อีกที");if(btn){btn.disabled=false;btn.textContent="ส่งให้ทีมงาน"}return}
    HATT=[];HELP=null;toast("ส่งให้ทีมงานแล้ว 🤍");await ensureHelp();
  }catch(e){
    toast(e.message==="too_many_open"?"มีเรื่องที่ยังไม่ปิดหลายเรื่องแล้ว ตอบในเรื่องเดิมได้เลยนะ":(e.message||"ส่งไม่สำเร็จ"));
    if(btn){btn.disabled=false;btn.textContent="ส่งให้ทีมงาน"}
  }
}

function wireChoices(notes,handlers){var cs=document.querySelectorAll("#hrstage .hchip");
 cs.forEach(function(c,idx){c.onclick=function(){cs.forEach(function(x){x.onclick=null});c.classList.add("pick");
   if(handlers&&handlers[idx]){handlers[idx]();return}

   delay(function(){proceed("รับทราบ"+kb())},msg?450:260)}})}
function tomorrow9(){var d=new Date(Date.parse(todayBKK()+"T00:00:00Z")+86400000).toISOString().slice(0,10);return wallUtc(d,"09:00").toISOString()}
function setRem(text,okMsg){
 api("reminder.add",{text:text,remind_at:tomorrow9()})
   .then(function(){noteEl(okMsg||("ตั้งเตือนแล้ว ✓ พรุ่งนี้ 9:00 เลขาจะทวงให้"+kb()));delay(function(){proceed("อยู่ในมือเลขาแล้ว →")},400)})
   .catch(function(){noteEl("ตั้งเตือนไม่สำเร็จ — ไว้พิมพ์บอกเลขาในแชตได้"+kb());delay(function(){proceed("ไปต่อกันก่อน →")},400)})}

function stepBreathe(){var need=3,done=0;
 render(jhead("หายใจด้วยกันจริง ๆ")+
   '<h1 style="font-size:16px">อันนี้ต้องทำจริง ไม่มีทางลัด<span class="soft"><b>กดวงกลมค้างไว้</b>ตอนสูดเข้า (4 วิ) แล้ว<b>ปล่อย</b>ตอนผ่อนออก (6 วิ) ให้ไหล่ตกตอนปล่อย — ครบ '+need+' เฮือกถึงไปต่อได้</span></h1>'+
   '<div class="hmid"><div class="horb" id="hrorb">กดค้าง<br>เมื่อพร้อม</div><div class="hbtag" id="hrbtag">เฮือกที่ 1 / '+need+'</div></div>');
 var orb=$h("hrorb"),holdT0=0,holding=false,exhaleTimer=null;
 function setTag(){var el=$h("hrbtag");if(el)el.textContent=done<need?("เฮือกที่ "+(done+1)+" / "+need):"ครบแล้ว"}
 function down(e){e.preventDefault();if(done>=need||holding)return;holding=true;holdT0=Date.now();
   if(exhaleTimer){clearTimeout(exhaleTimer);exhaleTimer=null}
   orb.classList.remove("shrink");orb.classList.add("grow");orb.innerHTML="สูดเข้า...<br>ค้างไว้"}
 function up(e){e.preventDefault();if(!holding)return;holding=false;
   var held=(Date.now()-holdT0)/1000;
   orb.classList.remove("grow");orb.classList.add("shrink");
   if(held<2.5){orb.innerHTML="ยังสั้นไป"+kb()+"<br>สูดให้ถึง 4 วิ";return}
   orb.innerHTML="ผ่อนออก...<br>ไหล่ตก";
   exhaleTimer=setTimeout(function(){done++;setTag();
     if(done>=need){orb.innerHTML="ดีมาก"+kb()+" ✓";orb.onpointerdown=null;orb.onpointerup=null;
       hbub("เห็นมั้ย"+kb()+" ร่างกายนำใจเสมอ — คุมลมหายใจได้ ก็ดึงเกมกลับมาได้");hpose("p06-ok-wink");
       proceed()}
     else orb.innerHTML="อีก "+(need-done)+" เฮือก"+kb()+"<br>กดค้างเลย"},5000)}
 orb.onpointerdown=down;orb.onpointerup=up;orb.onpointercancel=up;orb.onpointerleave=up}

   .catch(function(){cb(undefined)})}catch(e){cb(undefined)}}

 render(head("ก่อนกลับเข้าห้อง")+
   '<h1 style="font-size:16.5px">เอาจริง ๆ — ตอนนี้ใจเป็นไง'+kb()+'</h1>'+
   '<div class="hchoices">'+chipf("เบาขึ้น")+chipf("พอ ๆ เดิม")+chipf("ยังหนักอยู่")+'</div>');
 var cs=document.querySelectorAll("#hrstage .hchip");
 cs.forEach(function(c,idx){c.onclick=function(){cs.forEach(function(x){x.onclick=null});c.classList.add("pick");
   delay(function(){[finBetter,finSame,finHeavy][idx]()},300)}})}

 hbub("กลับไปลุยต่อได้"+kb()+"บอส — ปัญหาอาจยังอยู่ที่เดิม แต่บอสพร้อมกว่าเมื่อ 3 นาทีที่แล้ว");
 render('<div class="htag">รอบนี้ช่วยได้ · เก่งมาก'+kb()+'</div>');
 sendOutcome("better",function(t){earnSpark(2,function(){
   var a=addBtn("กลับเข้าห้อง");once(a,hrHome);
   var b=addBtn("💬 แชตกับเลขาต่อ",true);once(b,vent)},false,t)})}
function finSame(){S.prev_outcome="same";hpose("p13-sofa-relax");
 hbub("พอ ๆ เดิมก็ไม่แปลก"+kb()+" บางเรื่องมันหนักจริง รอบเดียวไม่พอ — ไม่ได้แปลว่าบอสทำผิดวิธี");
 render('<div class="htag">ขอบคุณที่ตอบตามจริง'+kb()+'</div>');
 sendOutcome("same",function(t){earnSpark(2,function(){
   var a=addBtn("อีกรอบสั้น ๆ");once(a,function(){runJourney(journeyKey)});
   var b=addBtn("💬 เล่าให้เลขาฟังต่อ",true);once(b,vent);
   var c=addBtn("กลับเข้าห้อง",true);once(c,hrHome)},false,t)})}
function finHeavy(){S.prev_outcome="heavy";hpose("p10-heart");
 hbub("งั้นอย่าเพิ่งอยู่คนเดียวตอนนี้"+kb()+" บางเรื่องต้องการคนฟังจริง ๆ ไม่ใช่หน้าจอ — <b>พรุ่งนี้เลขาจะทักไปถามเอง</b>");
 render('<div class="htag">เราอยู่ตรงนี้กับบอส</div>');
 /* ตอนใจหนัก: ✦ เข้าเงียบ ๆ ไม่เด้งป๊อปอัพฉลองทับหน้า 1323 — ไปฉลองตอนกลับเข้าห้องแทน */
 sendOutcome("heavy",function(t){earnSpark(2,function(){
   var a=addBtn("💬 คุยกับเลขาตอนนี้");once(a,vent);
   var tl=document.createElement("a");tl.className="hbtn ghost";tl.href="tel:1323";tl.textContent="📞 สายด่วนใจ 1323 (ฟรี 24 ชม.)";
   tl.style.textAlign="center";tl.style.textDecoration="none";tl.style.display="block";inner().appendChild(tl);
   var b=addBtn("กลับเข้าห้อง",true);once(b,hrHome)},true,t)})}
function safety(fromDiary){
 /* จากเครื่องมือ (vent/dump): แจ้ง heal.log ธง safety — จากไดอารี่: เซิร์ฟเวอร์ธงให้แล้วตอน heal.checkin */

 $h("healroom").style.display="flex";document.body.style.overflow="hidden";
 hbub("แป๊บนึง"+kbNa()+" บอสซี่กำลังเปิดไฟในห้อง");hpose("p01-clipboard-hello");
 render('<div class="htag">กำลังเปิดห้อง...</div>');
 var ub=$h("hrunbtn");if(ub)ub.onclick=closeUnlock;
 var xc=$h("hrclose");if(xc)xc.onclick=closeHealRoom;
 var tries=0;
 var iv=setInterval(function(){if(!IDT&&tries++<40)return;clearInterval(iv);
   api("heal.state").then(function(st){S=st;hrHome();
     if(mode==="checkin"&&!S.checked_today)checkin()})
   .catch(function(){
     S={today:new Date().toISOString().slice(0,10),sparks:0,streak:0,checked_today:false,diary_today:false,last_check:null,prev_mood:null,prev_outcome:null,celebrated:0};
     hrHome()})},250)};

})();

/* 🛡️ ปิดบังเบอร์โดยปริยาย — แตะเพื่อดู แล้วปิดเองใน 6 วิ (กันคนมองข้างจอ/หลุดตอนแคป) */
function phMaskTxt(p){p=String(p);return p.length>=7?p.slice(0,3)+'•••'+p.slice(-3):'•••'}
function phMask(p){return '<span data-ph="'+esc(p)+'" onclick="phReveal(this);event.stopPropagation()" style="cursor:pointer;border-bottom:1px dashed #C4547E">'+phMaskTxt(p)+' 👁</span>'}
window.phReveal=function(el){var f=el.getAttribute('data-ph')||'';if(el.getAttribute('data-on')==='1'){el.setAttribute('data-on','');el.innerHTML=phMaskTxt(f)+' 👁';return}el.setAttribute('data-on','1');el.textContent=f;setTimeout(function(){if(el.getAttribute('data-on')==='1'){el.setAttribute('data-on','');el.innerHTML=phMaskTxt(f)+' 👁'}},6000)};

/* 🛡️ ม่านความเป็นส่วนตัว: สลับแอป/พับจอปุ๊บ เบลอทั้งหน้า -> ภาพ preview ใน app switcher เป็นม่าน ไม่ใช่ข้อมูลบอส

(function(){
var v=document.createElement('div');v.id='pveil';
v.style.cssText='position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,.78);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)';
v.innerHTML='<div style="text-align:center;color:#C4547E;font-weight:800;font-size:17px">🔒<br>ปกป้องข้อมูลของบอสอยู่<div style="font-size:12px;color:#85858E;font-weight:600;margin-top:5px">แตะเพื่อดูต่อ</div></div>';
v.onclick=function(){v.style.display='none'};
document.body.appendChild(v);
document.addEventListener('visibilitychange',function(){v.style.display=document.hidden?'flex':'none'});
/* 🔄 กลับมาที่หน้า (สลับไปแชต/ย่อหน้าต่าง LIFF แล้วกลับมา) + ข้อมูลเก่ากว่า 20 วิ -> ดึงยอดใหม่เอง
   แก้เคสจริง: จดเงินในแชตแล้วสลับกลับมา แดชบอร์ดโชว์เลขเก่า ลูกค้าคิดว่าไม่บันทึก เลยส่งสลิปซ้ำ (2026-07-09) */
document.addEventListener('visibilitychange',function(){if(!document.hidden&&DATA&&LSYNC&&Date.now()-LSYNC>20000){MCACHE={};reload().catch(function(){})}});
window.addEventListener('pageshow',function(e){if(e&&e.persisted&&DATA){MCACHE={};reload().catch(function(){})}});
window.addEventListener('pagehide',function(){v.style.display='flex'});
})();

boot();
