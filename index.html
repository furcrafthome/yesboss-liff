<style>
/* ═══ 🎨 ระบบสี — ตรวจ WCAG AA แล้วทุกคู่ (ตรวจหน้าบ้าน 25 ก.ค. พบตก 11 จาก 14 จุด) ═══
   แยก 2 ชั้นโดยตั้งใจ:
   --brand (#ED6885) = สีแบรนด์ ใช้กับของ "ตกแต่ง/ตัวใหญ่" เท่านั้น (ตัวเลขใหญ่ แถบ ไอคอน จุด)
   --brand-ink (#C92A5E) = ใช้ทุกที่ที่มี "ตัวหนังสือทับอยู่" (ปุ่ม แถบล่างที่เลือก) — ขาวบนสีนี้ได้ 5.28
   เดิมปุ่มหลักใช้ #ED6885 ตัวหนังสือขาว = 3.03 ตกมาตรฐาน กลางแดดอ่านไม่ออกจริง */
:root{
  color-scheme:light dark;
  --bg:#FAFAFB; --surface:#fff; --line:#E9E9EF; --line2:#EDEDF2;
  --ink:#26262E; --ink-strong:#23232B; --muted:#6F6F78;   /* muted 4.98 บนขาว / 4.77 บนพื้น */
  --brand:#ED6885; --brand-ink:#C92A5E; --brand-soft:#FCE0EA; --brand-line:#F0C9D8; --field:#FAFAFC;
  --pos:#177E37; --neg:#C62828;                            /* รายรับ 5.15 / รายจ่าย 5.62 */
  --pill-bg:#F2F2F5; --shadow:rgba(237,104,133,.08);
  --tap:44px;                                              /* พื้นที่กดขั้นต่ำ iOS/Android/WCAG */
}
/* 🌙 โหมดมืด — LINE มีโหมดมืดทั้ง iOS/Android เดิมหน้านี้ล็อก light ไว้ = จอขาวจ้าใส่กลางดึก */
@media (prefers-color-scheme:dark){
  :root{
    --bg:#16161C; --surface:#1F1F27; --line:#2E2E38; --line2:#2A2A33;
    --ink:#EDEDF2; --ink-strong:#fff; --muted:#A9A9B6;
    --brand:#FF9FBB; --brand-ink:#FF9FBB; --brand-soft:#3A2530; --brand-line:#4A2F3B; --field:#24242D;
    --pos:#5DD47C; --neg:#FF8A80; --pill-bg:#2A2A33; --shadow:rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,'Sukhumvit Set','Noto Sans Thai',sans-serif;padding:16px 14px calc(96px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
/* ⌨️ กรอบโฟกัส: เดิมมี outline:none ในฟอร์มลงทะเบียน เหลือแค่เปลี่ยนสีขอบ 1.5px = แทบมองไม่เห็น */
:focus-visible{outline:3px solid var(--brand-ink);outline-offset:2px;border-radius:6px}
/* ♿ เคารพการตั้งค่า "ลดการเคลื่อนไหว" ของเครื่อง (เดิมไม่มีเลย) */
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
h1{font-size:23px;margin:0;font-weight:800;color:var(--ink-strong);letter-spacing:-.3px}
.sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:14px 0}
.c{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px 14px;box-shadow:0 4px 14px var(--shadow)}
.v{font-size:26px;font-weight:800;line-height:1.12;color:var(--brand-ink)}
.l{font-size:11.5px;color:var(--muted);margin-top:4px;font-weight:600}
h2{font-size:16px;color:var(--ink);margin:24px 2px 11px;font-weight:800;display:flex;align-items:center;gap:9px}
h2:before{content:"";width:5px;height:19px;background:linear-gradient(var(--brand),var(--brand-ink));border-radius:3px;display:inline-block;flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 13px;margin-bottom:10px;box-shadow:0 2px 10px var(--shadow)}
.rowitem{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 8px 10px 13px;margin-bottom:9px;font-size:14.5px;box-shadow:0 2px 8px var(--shadow);min-height:var(--tap)}
.rowitem .grow{flex:1;min-width:0}
.rowitem .t{overflow-wrap:anywhere;font-weight:600;color:var(--ink)}
.rowitem .m{font-size:11.5px;color:var(--muted);margin-top:3px}
/* 👆 ปุ่มทุกตัวต้องกดโดนอย่างน้อย 44×44 — เดิมปุ่มลบ 23×27px นั่งติดปุ่มนาฬิกา กดพลาดง่ายมาก */
.btn{background:var(--brand-ink);color:#fff;border:none;border-radius:11px;padding:10px 15px;font-size:14.5px;font-weight:700;font-family:inherit;box-shadow:0 3px 9px rgba(201,42,94,.26);min-height:var(--tap)}
.btn:active{opacity:.85}
.btn.ghost{background:var(--brand-soft);color:var(--brand-ink);box-shadow:none}
.btn.warn{background:#FDECEF;color:#B3261E;border:1px solid #F0AFB6;box-shadow:none}
@media (prefers-color-scheme:dark){.btn{color:#2A0A16}.btn.warn{background:#3A1F22;color:#FF9E96;border-color:#5A2E31}}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:10px;min-height:40px}
.ic{background:none;border:none;font-size:19px;color:var(--muted);min-width:var(--tap);min-height:var(--tap);display:inline-flex;align-items:center;justify-content:center;flex:none;border-radius:10px}
.ic:active{background:var(--pill-bg)}
.ic.danger{color:var(--neg)}
/* กล่องติ๊กงาน: กรอบที่เห็น 24px แต่พื้นที่กดจริง 44px (padding เป็นตัวขยาย ไม่ดันหน้าเบี้ยว) */
.chk{width:var(--tap);height:var(--tap);padding:10px;border:none;background:none;flex:none;display:flex;align-items:center;justify-content:center;color:var(--pos)}
.chk:before{content:"";width:24px;height:24px;border-radius:7px;border:2px solid var(--pos);display:block}
.chk.done:before{content:"✓";display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800}
input,select,textarea{width:100%;background:var(--field);border:1px solid var(--brand-line);border-radius:11px;color:var(--ink);padding:11px 12px;font-size:16px;font-family:inherit;margin-top:5px;min-height:var(--tap)}
/* font-size:16px บน input = iOS ไม่ซูมหน้าเองตอนโฟกัส (เดิม 15px ทำให้หน้าเด้งซูมทุกครั้งที่พิมพ์) */
textarea{min-height:96px;resize:vertical;line-height:1.6}
label.f{display:block;font-size:12px;color:var(--muted);margin-top:13px;font-weight:600}
.seg{display:flex;gap:8px;margin-top:6px}
.seg button{flex:1;background:var(--field);border:1px solid var(--brand-line);color:var(--ink);border-radius:11px;padding:11px 4px;font-size:14px;font-family:inherit;min-height:var(--tap)}
.seg button.on{background:var(--brand-ink);border-color:var(--brand-ink);color:#fff;font-weight:700}
@media (prefers-color-scheme:dark){.seg button.on{color:#2A0A16}}
.moods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.moods button{background:var(--field);border:1px solid var(--brand-line);border-radius:13px;padding:10px 2px;font-family:inherit;color:var(--ink);font-size:12px;min-height:60px}
.moods button .e{font-size:24px;display:block}
.moods button.on{border-color:#B07A00;background:#FFF6E2;color:#4A3400}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:8px 0;background:var(--line)}
.bar span{display:block;height:100%}
.pill{display:inline-block;font-size:11px;padding:2px 10px;border-radius:999px;background:var(--pill-bg);color:var(--muted);margin-left:6px;vertical-align:middle;font-weight:600}
.safety{background:#FFF1F4;border:1px solid #F3C0D0;border-radius:16px;padding:14px;margin-bottom:10px;font-size:13.5px;line-height:1.6;color:#3A3A44}
.safety a{color:#B3175A;font-weight:700}
.err{text-align:center;color:var(--muted);padding:60px 20px;font-size:15px;line-height:1.9}
.empty{color:var(--muted);font-size:13px;padding:8px 2px}
.gh{font-size:12.5px;color:var(--muted);margin:14px 4px 7px;font-weight:700}
.add{background:var(--surface);border:1.5px dashed var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.add .at{font-weight:800;color:var(--brand-ink);font-size:14.5px;margin-bottom:4px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 12px var(--shadow);z-index:8}
.nav button{flex:1;background:none;border:none;color:var(--muted);font-family:inherit;font-size:11px;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;min-height:56px}
.nav button .ne{font-size:20px}
.nav button.on{color:var(--brand-ink);font-weight:800}
.nav button.on .ne{transform:translateY(-1px)}
#toast{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));background:var(--ink-strong);color:var(--bg);padding:12px 14px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;transform:translateY(8px);z-index:12;box-shadow:0 6px 22px rgba(0,0,0,.22);display:flex;align-items:center;gap:10px;max-width:520px;margin:0 auto}
#toast.show{opacity:1;transform:none;pointer-events:auto}
#toast .tmsg{flex:1;min-width:0}
/* ↩️ ปุ่มเลิกทำในแถบแจ้งเตือน — ตัวนี้แหละที่มาแทน confirm() ทั้ง 8 จุด */
#toast .tundo{background:var(--brand);color:#2A0A16;border:none;border-radius:9px;padding:8px 14px;font-family:inherit;font-size:13.5px;font-weight:800;flex:none;min-height:40px}
.foot{color:var(--muted);font-size:11px;text-align:center;margin:22px 0 4px}
.plan{float:right;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:11px;font-weight:700;padding:6px 11px;border-radius:999px;margin-top:2px;min-height:32px;display:inline-flex;align-items:center}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:15px 0}
.st{background:var(--surface);border-radius:18px;padding:13px;box-shadow:0 4px 15px var(--shadow);display:flex;align-items:center;gap:11px;min-height:var(--tap);border:1px solid var(--line)}
.st .ico{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.st .big{font-size:21px;font-weight:800;line-height:1}
.st .cap{font-size:11px;color:var(--muted);margin-top:3px}
.ct{font-size:15px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:7px;margin-bottom:8px}
.ct .more{margin-left:auto;font-size:11.5px;color:var(--brand-ink);font-weight:700}
.don{display:flex;align-items:center;gap:15px}
.leg{font-size:12.5px;flex:1}
.leg>div{display:flex;align-items:center;gap:7px;margin:7px 0}
.leg b{margin-left:auto}
.dot{width:11px;height:11px;border-radius:3px;flex:none}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead .mo{font-size:15px;font-weight:800}
.nav2{width:var(--tap);height:var(--tap);border-radius:12px;background:var(--brand-soft);color:var(--brand-ink);border:none;font-family:inherit;font-size:17px;font-weight:700;flex:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal .wd{font-size:11px;color:var(--muted);font-weight:700;padding-bottom:3px}
.cal .d{aspect-ratio:1;min-height:40px;display:flex;align-items:center;justify-content:center;font-size:13.5px;border-radius:11px;position:relative;color:var(--ink);border:none;background:none;font-family:inherit}
.cal .d.today{background:var(--brand-ink);color:#fff;font-weight:800;box-shadow:0 3px 9px rgba(201,42,94,.34)}
.cal .d.sel{outline:2px solid var(--brand-ink);outline-offset:-2px;font-weight:800}
.cal .d .ev{width:5px;height:5px;border-radius:50%;background:var(--brand-ink);position:absolute;bottom:5px;left:50%;transform:translateX(-50%)}
.cal .d.today .ev{background:#fff}
.cal .d.mut{color:transparent;pointer-events:none}
.appt{display:flex;align-items:center;gap:11px;padding:8px 0;border-top:1px solid var(--line2);min-height:var(--tap)}
.appt .tm{font-size:12px;font-weight:800;color:var(--brand-ink);width:54px;flex:none}
.appt .tt{font-size:14px;font-weight:600}
.task{display:flex;align-items:center;gap:8px;padding:4px 0;border-top:1px solid var(--line2);min-height:var(--tap)}
.task .tx{font-size:14.5px;font-weight:600;flex:1;overflow-wrap:anywhere}
.badge{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;flex:none}
.b-late{background:#FDE7EA;color:#A5231C}
.b-todo{background:#E7F6EC;color:#12662C}
.b-soon{background:#FFF3DC;color:#7A5200}
@media (prefers-color-scheme:dark){
  .b-late{background:#3A1F22;color:#FF9E96}.b-todo{background:#17321F;color:#7FE29A}.b-soon{background:#332818;color:#F5C462}
  .safety{background:#33202A;border-color:#5A3543;color:#F0E2E8}.safety a{color:#FF9FBB}
  .moods button.on{background:#3A3018;border-color:#B08A2E;color:#F5DFA8}
}
.spin{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--brand);border-radius:50%;margin:0 auto 14px;animation:sp .8s linear infinite}
.ldr{min-height:86vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.ldr img{width:112px;animation:bnc .5s ease-in-out infinite alternate}
@keyframes bnc{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-18px) rotate(4deg)}}
.ldrsh{width:64px;height:10px;border-radius:50%;background:rgba(232,119,155,.18);margin-top:-12px;animation:shd .5s ease-in-out infinite alternate}
@keyframes shd{from{transform:scaleX(1);opacity:.9}to{transform:scaleX(.55);opacity:.4}}
.ldrbar{width:200px;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.ldrbar i{display:block;height:100%;width:45%;background:linear-gradient(90deg,#F4A9C0,var(--brand));border-radius:99px;animation:runb 1.1s ease-in-out infinite}
@keyframes runb{0%{margin-left:-45%}100%{margin-left:100%}}
.ldrtx{font-size:13.5px;color:var(--muted)}
.ik{vertical-align:-3px}
.ne .ik{display:block;margin:2px auto 3px}
@keyframes sp{to{transform:rotate(360deg)}}
/* 👁️ ข้อความสำหรับ screen reader อย่างเดียว (ปุ่มไอคอนล้วนต้องมีชื่อ ไม่งั้นอ่านออกมาว่า "ปุ่ม" เฉยๆ) */
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* ✏️ แผงแก้ไขในแถว (งาน/นัด/เงิน) — เดิมแก้อะไรไม่ได้เลย ต้องลบทิ้งแล้วพิมพ์ใหม่ในแชต */
.edit{background:var(--field);border:1px solid var(--brand-line);border-radius:12px;padding:11px;margin:6px 0 10px}
.edit .row2{display:flex;gap:8px}
.edit .row2>*{flex:1}
.edit input,.edit select{margin-top:4px}
.eact{display:flex;gap:8px;margin-top:10px}
.eact .btn{flex:1}
/* 🎫 Support Center */
.tk{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:9px;box-shadow:0 2px 8px var(--shadow)}
.tk .th{display:flex;align-items:center;gap:8px;font-weight:700}
.tk .ts{font-size:11.5px;color:var(--muted);margin-top:4px}
.msg{border-radius:14px;padding:10px 13px;margin:8px 0;font-size:14px;line-height:1.6;max-width:86%;overflow-wrap:anywhere}
.msg.u{background:var(--brand-soft);color:var(--ink);margin-left:auto}
.msg.s{background:var(--field);border:1px solid var(--line);color:var(--ink)}
.msg .mt{font-size:10.5px;color:var(--muted);margin-top:5px}
.msg img{max-width:100%;border-radius:9px;margin-top:7px;display:block}
.att{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.att .thumb{position:relative;width:64px;height:64px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.att .thumb img{width:100%;height:100%;object-fit:cover}
.att .thumb button{position:absolute;top:0;right:0;background:rgba(0,0,0,.6);color:#fff;border:none;width:24px;height:24px;font-size:14px;border-radius:0 0 0 8px;min-width:24px;min-height:24px}
/* 🔋 การ์ดฮีโร่ทางเข้าห้องพักใจ — ใหญ่ เด่น ชวนกด */
.hlhero{position:relative;overflow:hidden;background:linear-gradient(150deg,#1b2450,#0b1020 70%);border-radius:22px;padding:24px 18px 20px;margin-top:12px;text-align:center;cursor:pointer;box-shadow:0 10px 30px rgba(18,24,58,.35)}
.hlhero:before{content:"";position:absolute;top:-70px;left:50%;transform:translateX(-50%);width:280px;height:280px;background:radial-gradient(circle,rgba(122,162,255,.38),transparent 65%);pointer-events:none}
.hlhero img{width:104px;position:relative;animation:hlfloat 2.6s ease-in-out infinite}
@keyframes hlfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.hlhero .hlt{font-size:24px;font-weight:800;color:#fff;margin-top:4px;position:relative}
.hlhero .hls{font-size:13.5px;color:#cfd8f7;line-height:1.65;margin-top:6px;position:relative}
.hlhero .hlbtn{position:relative;display:block;width:100%;border:0;border-radius:99px;margin-top:16px;padding:16px;font-size:17px;font-weight:800;color:#12183a;background:#fff;animation:hlpulse 1.8s ease-in-out infinite;cursor:pointer}
@keyframes hlpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.5);transform:scale(1)}50%{box-shadow:0 0 0 14px rgba(255,255,255,0);transform:scale(1.02)}}
/* ---------- 🔋 ห้องพักใจ (โลกอีกใบ: มืด สงบ — จงใจต่างจากธีมหลัก) ---------- */
#healroom{position:fixed;inset:0;z-index:50;background:#0b1020;display:none;color:#eef2ff}
#healroom .hwrap{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top)) 20px calc(16px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
#hrscene{position:absolute;inset:0;transition:background 1.4s ease;z-index:0}
#healroom .hbrow{display:flex;align-items:center;gap:12px}
#healroom .hbatt{flex:1;height:30px;border:3px solid rgba(255,255,255,.55);border-radius:10px;position:relative;padding:3px;background:rgba(0,0,0,.28)}
#healroom .hbatt:after{content:"";position:absolute;right:-9px;top:50%;transform:translateY(-50%);width:6px;height:14px;background:rgba(255,255,255,.55);border-radius:0 3px 3px 0}

function dlg(o){
  return new Promise(function(res){

      +'<div style="font-size:14px;line-height:1.65;color:var(--muted);margin-top:9px">'+o.body+'</div>'
      +(need?'<label class="f" for="dlgin">พิมพ์คำว่า <b style="color:var(--neg)">'+esc(need)+'</b> เพื่อยืนยัน</label><input id="dlgin" autocomplete="off" autocapitalize="off">':'')
      +'<div class="eact"><button class="btn warn" id="dlgok"'+(need?" disabled":"")+'>'+esc(o.okText||"ยืนยัน")+'</button>'
      +'<button class="btn ghost" id="dlgno">ไม่ลบแล้ว</button></div></div>';
    document.body.appendChild(w);
    var ok=w.querySelector("#dlgok"),no=w.querySelector("#dlgno"),inp=w.querySelector("#dlgin");
    function close(v){document.body.removeChild(w);document.removeEventListener("keydown",esckey);res(v)}
    function esckey(e){if(e.key==="Escape")close(false)}

    else{setTimeout(function(){no.focus()},50)}

function thToday(){try{return new Date().toLocaleDateString("th-TH",{day:"numeric",month:"long",timeZone:TZ()})}catch(e){return ""}}
function thDate(iso){try{return new Date(iso+"T00:00:00").toLocaleDateString("th-TH",{weekday:"short",day:"numeric",month:"short"})}catch(e){return iso}}
function thMonth(off){var d=new Date();d.setDate(1);d.setMonth(d.getMonth()+off);return THMON[d.getMonth()]+" "+d.getFullYear()} // setDate(1) ก่อน: วันที่ 29-31 บวกเดือนแล้วล้น หัวเดือนเพี้ยน

function donutSvg(income,expense){

    s+='<circle cx="63" cy="63" r="52" fill="none" stroke="#FB7185" stroke-width="16" stroke-dasharray="'+exp+' '+(c-exp)+'" stroke-dashoffset="'+(-inc)+'" transform="rotate(-90 63 63)"/>';

function calMonth(){
  var now=new Date(),base=new Date(now.getFullYear(),now.getMonth()+CALM,1);
  var y=base.getFullYear(),mo=base.getMonth(),first=new Date(y,mo,1).getDay(),days=new Date(y,mo+1,0).getDate();
  var ev={},rem=(DATA.reminders||[]);
  for(var i=0;i<rem.length;i++){var ds=bkkYMD(rem[i].remind_at).split("-");if(+ds[0]===y&&+ds[1]===mo+1){ev[+ds[2]]=1}}
  var tp=todayBKK().split("-"),isCurM=(+tp[0]===y&&+tp[1]===mo+1),td=+tp[2];
  var h='<div class="calhead"><button class="nav2" onclick="calShift(-1)">‹</button><div class="mo">'+THMON[mo]+' '+y+'</div><button class="nav2" onclick="calShift(1)">›</button></div><div class="cal">';
  var wd=["อา","จ","อ","พ","พฤ","ศ","ส"];for(var w=0;w<7;w++){h+='<div class="wd">'+wd[w]+'</div>'}
  for(var b=0;b<first;b++){h+='<div class="d mut"></div>'}
  for(var dd=1;dd<=days;dd++){h+='<div class="d'+(isCurM&&dd===td?" today":"")+'" onclick="pickDay('+y+','+mo+','+dd+')">'+dd+(ev[dd]?'<span class="ev"></span>':'')+'</div>'}
  return h+'</div>';
}
function calShift(n){CALM+=n;if(CALM===0){SELISO=null}else{var b=new Date();b.setDate(1);b.setMonth(b.getMonth()+CALM);SELISO=b.getFullYear()+"-"+("0"+(b.getMonth()+1)).slice(-2)+"-01"}draw()}

function toggleAppt(){var f=$("#apform");if(f){f.style.display=f.style.display==="none"?"block":"none";var t=$("#ap_txt");if(t&&f.style.display==="block"){t.focus()}}}
async function saveAppt(iso){
  var t=$("#ap_txt")?$("#ap_txt").value.trim():"";
  if(!t){toast("บอกก่อนว่านัดอะไรนะ");return}
  var tm=$("#ap_time")&&$("#ap_time").value?$("#ap_time").value:"09:00";
  var d=wallUtc(iso,tm);
  if(d.getTime()<Date.now()-60000){toast("เวลานี้ผ่านมาแล้ว เลือกใหม่นะ");return}
  await act("reminder.add",{text:t,remind_at:d.toISOString()},"เพิ่มนัดแล้ว จะเตือนตรงเวลาเลย ⏰");
}

/* ═══ 📅 วันนี้ / ถัดไป — รวมงานกับนัดไว้ที่เดียว แต่แยกความหมายให้ชัด ═══
   ปัญหาเดิม (ตรวจ 25 ก.ค.): ระบบมี 3 คำที่ทับกันมั่ว — "งาน" / "นัด" / "เตือน"
   ทั้งที่ "เตือน" ไม่ใช่ประเภทที่ 3 แต่เป็น *วิธีบอก* ของนัด · แท็บชื่อ "เตือน+งาน"
   หัวข้อในหน้าเขียน "การแจ้งเตือนที่รออยู่" การ์ดหน้าหลักเขียน "นัดวันนี้" — นับจากตารางเดียวกันหมด
   และไม่มีอะไรตอบ "พรุ่งนี้-สัปดาห์นี้มีอะไรบ้าง" ได้เลย

   เคาะคำใหม่ (ใช้ทั้งระบบตั้งแต่นี้):
     📌 นัด = มีเวลาแน่นอน พลาดแล้วพลาดเลย (ตาราง reminders)
     ✅ งาน = สิ่งที่ต้องทำให้เสร็จ มีกำหนดหรือไม่มีก็ได้ (ตาราง tasks)
     🔔 เตือน = แค่วิธีบอก ไม่ใช่ประเภทของสิ่งของ — จึงไม่มีหัวข้อชื่อนี้อีกต่อไป */
function dayKey(d){try{return new Date(d).toLocaleDateString("en-CA",{timeZone:TZ()})}catch(e){return String(d).slice(0,10)}}
function addDays(ymd,n){var d=new Date(ymd+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
/* รวมงาน+นัดเป็นรายการเดียว แล้วแบ่งกอง: เลยกำหนด / วันนี้ / พรุ่งนี้ / สัปดาห์นี้ / ต่อไป / ไม่มีกำหนด */
function agenda(){
  var today=todayBKK(),tmr=addDays(today,1),wk=addDays(today,7),now=Date.now();
  var B={late:[],today:[],tmr:[],week:[],later:[],none:[]};
  (DATA.reminders||[]).forEach(function(r,ri){
    var k=dayKey(r.remind_at);
    // ri = ตำแหน่งใน DATA.reminders — edRem() ใช้ค้นตัวเดิมกลับ (แผงแก้ไขวาดลงกล่อง #rs<ri>)
    var it={type:"appt",id:r.id,idx:ri,text:r.reminder_text,at:r.remind_at,allDay:r.all_day,repeat:r.repeat,sort:Date.parse(r.remind_at)||0};
    if(Date.parse(r.remind_at)<now&&k<today)B.late.push(it);
    else if(k===today)B.today.push(it);
    else if(k===tmr)B.tmr.push(it);
    else if(k<wk)B.week.push(it);
    else B.later.push(it);
  });
  ((DATA.tasks&&DATA.tasks.open)||[]).forEach(function(t){
    var due=t.due_date?String(t.due_date).slice(0,10):null;
    var it={type:"task",id:t.id,text:t.task_text,due:due,sort:due?Date.parse(due+"T23:59:59Z"):Infinity};
    if(!due)B.none.push(it);
    else if(due<today)B.late.push(it);
    else if(due===today)B.today.push(it);
    else if(due===tmr)B.tmr.push(it);
    else if(due<wk)B.week.push(it);
    else B.later.push(it);
  });
  ["late","today","tmr","week","later"].forEach(function(k){B[k].sort(function(a,b){return a.sort-b.sort})});
  return B;
}
function agRow(it){

    return '<div class="rowitem"><div style="font-size:12px;font-weight:800;color:var(--brand-ink);width:56px;flex:none">'+esc(tm)+'</div>'
      +'<div class="grow"><div class="t">📌 '+esc(it.text)+(it.repeat&&it.repeat!=="none"?'<span class="pill">🔁 '+({daily:'ทุกวัน',weekly:'ทุกสัปดาห์',monthly:'ทุกเดือน',yearly:'ทุกปี',weekdays:'จ-ศ',monthend:'สิ้นเดือน'}[it.repeat]||esc(it.repeat))+'</span>':'')+'</div></div>'
      +'<button class="ic" aria-label="แก้ไขนัด '+esc(it.text)+'" onclick="edRem('+it.idx+')">'+icn("pencil",15)+'</button>'
      +'<button class="ic danger" aria-label="ลบนัด '+esc(it.text)+'" onclick="delRem(\''+it.id+'\')">'+icn("trash",15)+'</button></div>'
      +'<div id="rs'+it.idx+'"></div>';
  }
  return '<div class="rowitem"><button class="chk" aria-label="ทำเสร็จแล้ว: '+esc(it.text)+'" onclick="tgTask(\''+it.id+'\',true)"></button>'
    +'<div class="grow"><div class="t">'+esc(it.text)+'</div></div>'
    +'<button class="ic" aria-label="แก้ไขงาน: '+esc(it.text)+'" onclick="edTask(\''+it.id+'\')">'+icn("pencil",15)+'</button></div>'
    +'<div id="et'+it.id+'"></div>';
}
function agSection(title,items,emptyMsg,cls){
  if(!items.length)return emptyMsg?'<h2>'+title+'</h2><div class="empty">'+emptyMsg+'</div>':"";
  var h='<h2>'+title+' ('+items.length+')</h2>';
  if(cls)h+='<div class="'+cls+'">';
  for(var i=0;i<items.length;i++)h+=agRow(items[i]);
  if(cls)h+='</div>';
  return h;
}

function vTodoRest(){
  var h='';
  /* 🏢 งานทีม (Business ฝั่งคนมอบ) — โชว์เสมอถ้าเป็น Business จะได้รู้ว่ามีมุมนี้ */
  if(DATA.team){
    h+='<h2>👥 งานที่มอบทีม ('+(DATA.team.open?DATA.team.open.length:0)+')</h2>';
    if(!DATA.team.open||!DATA.team.open.length){h+='<div class="empty">ยังไม่มีงานทีมค้าง — มอบในกลุ่มทีม: "บอส มอบงาน @คน งาน กำหนดส่ง"</div>'}
    var nowTm=Date.now();
    for(var q=0;q<(DATA.team.open||[]).length;q++){var tw=DATA.team.open[q];
      var late=tw.due_at&&Date.parse(tw.due_at)<nowTm;
      var stp=tw.blocked_at?'<span class="pill" style="background:#fde8e8;color:#b42318">🆘 ติดปัญหา</span>':late?'<span class="pill" style="background:#fde8e8;color:#b42318">🔥 เลยกำหนด</span>':tw.ack_at?'<span class="pill">🔨 กำลังทำ</span>':'<span class="pill" style="background:#fff3dc;color:#9a6700">👀 ยังไม่กดรับ</span>';
      h+='<div class="rowitem"><div class="grow"><div class="t">'+esc(tw.task_text)+' '+stp+'</div><div class="m">'+esc(tw.who||"สมาชิกทีม")+(tw.due_at?' · กำหนด '+fdate(tw.due_at):'')+'</div></div></div>';
    }
  }
  /* 📌 นัดทั้งหมดอยู่ในไทม์ไลน์ข้างบนแล้ว (วันนี้/พรุ่งนี้/สัปดาห์นี้/ถัดไป) — ไม่ทำลิสต์ซ้ำอีกชุด
     เดิมมีหัวข้อ "การแจ้งเตือนที่รออยู่" แยกอีกกอง = นัดเดียวโผล่สองที่ ลูกค้าอ่านแล้วนับไม่ตรง */

/* ISO -> ค่าที่ใส่ใน input[type=datetime-local] ได้ (ตามโซนเวลาที่ลูกค้าตั้งไว้ ไม่ใช่ของเครื่อง) */
function localInput(iso){
  try{
    var s=new Date(iso).toLocaleString("sv-SE",{timeZone:TZ()}); // sv-SE ให้รูปแบบ YYYY-MM-DD HH:MM:SS
    return s.slice(0,10)+"T"+s.slice(11,16);
  }catch(e){return String(iso).slice(0,16)}
}

/* ☑️ เลือกหลายรายการ: ติ๊กสะสมใน TSEL แล้วยิง API รายตัวตอนกดยืนยัน (ใช้ endpoint เดิม ไม่แตะหลังบ้าน) */
function tSelStart(){TSEL=new Set();draw()}
function tSelEnd(){TSEL=null;draw()}
function tSelTg(id){if(!TSEL)return;id=String(id);if(TSEL.has(id)){TSEL.delete(id)}else{TSEL.add(id)}draw()}
async function tSelDo(del){
  if(!TSEL||!TSEL.size){toast("ติ๊กเลือกงานก่อนนะ");return}
  var n=TSEL.size,ids=Array.from(TSEL),ok=0,er="";
  // ลบหลายงานพร้อมกันไม่ต้องถามแล้ว — ทุกใบถูกถ่ายสำเนาลงถังขยะ กดเลิกทำได้ทันที
  /* 🐛 25 ก.ค.: เดิม catch(e){} กลืน error ทุกชนิด + ไม่เช็ค ok:false ที่ API ส่งกลับตอนปิดไม่ติด
     แล้วเด้ง "ปิด N งานแล้ว 🎉" ทุกกรณี — โทเค็นหมดอายุ/เน็ตหลุด/แถวไม่แมตช์ = ลูกค้าเห็นข้อความสำเร็จ
     ทั้งที่ไม่มีอะไรถูกปิดจริง แล้วงานยังค้างเหมือนเดิม (ตรงกับอาการ "กดเสร็จแล้วไม่หาย ปิดแอปเปิดใหม่ก็ยังอยู่")
     กฎที่ยึด: นับผลจริงทีละใบ แล้วพูดตามที่เกิดขึ้นจริงเสมอ — สำเร็จบางส่วนก็ต้องบอกว่าบางส่วน */
  for(var i=0;i<ids.length;i++){
    try{
      var rs=await api(del?"task.delete":"task.toggle",del?{id:ids[i]}:{id:ids[i],done:true});
      if(rs&&rs.ok===false){er=er||(del?"ลบไม่ติด":"ปิดไม่ติด")}else{ok++}
    }catch(e){er=er||(e&&e.message)||"ผิดพลาด"}
  }
  TSEL=null;await reload();
  if(!ok){toast(er||(del?"ลบไม่สำเร็จ ลองใหม่อีกที":"ปิดงานไม่สำเร็จ ลองใหม่อีกที"));return}
  var part=ok<n?(" ("+ok+"/"+n+" — ที่เหลือไม่สำเร็จ ลองใหม่อีกที)"):"";
  if(!del){toast("ปิด "+ok+" งานแล้ว 🎉"+part);return}
  tshow("ลบ "+ok+" งานแล้ว"+part,async function(){
    try{
      var tr=await api("trash.list",{});
      var back=(tr.rows||[]).filter(function(r){return r.table==="tasks"}).slice(0,ok);
      for(var k=0;k<back.length;k++){await api("trash.restore",{id:back[k].id})}
      await reload();toast("เอา "+back.length+" งานกลับมาแล้ว 🤍");
    }catch(e){toast("กู้คืนไม่ได้ ลองดูใน ถังขยะ")}
  });
}

  if(!f){return}
  // ไม่ต้องถามยืนยัน — การกดนี้แค่พาไปพิมพ์ในแชต ไม่ได้ทำลายอะไร (confirm() ที่ขวางของไม่อันตราย = สร้างนิสัยกดผ่านโดยไม่อ่าน)
  try{
    if(liff.isInClient()){liff.sendMessages([{type:"text",text:"ขอแก้ความจำ: «"+f.fact_text+"»"}]);liff.closeWindow()}
    else{toast("เปิดในแอป LINE เพื่อแจ้งแก้ไขนะ")}
  }catch(e){try{liff.closeWindow()}catch(_e){toast("พิมพ์บอกเลขาในแชตได้เลยว่าตรงไหนไม่ถูก")}}

     ให้ปุ่มข้างในเป็นตัวรับการกดตัวเดียว ส่วนตัวครอบเป็นแค่พื้นหลัง = คีย์บอร์ด/screen reader เข้าถึงได้ถูกทาง */
  h+='<div class="hlhero">'
    +'<img src="img/p10-heart.webp" alt="">'
    +'<div class="hlt">'+icn("battery",22)+' ห้องพักใจ</div>'
    +'<div class="hls">โมโห เครียด เหนื่อยใจ?<br>แวะชาร์จพลังใจแค่ 2–3 นาที แล้วค่อยกลับไปลุยต่อ</div>'
    +'<button type="button" class="hlbtn" onclick="openHealRoom()">'+icn("battery",17)+' เข้าห้องพักใจ →</button>'
    +'</div>';
  h+='<h2>วันนี้รู้สึกยังไง?</h2><div class="card"><div class="moods" id="moodpick">';
  for(var key in MOOD_TH){h+='<button data-m="'+key+'" onclick="pickMood(this,\''+key+'\')"><span class="e">'+MOOD_TH[key][0]+'</span>'+MOOD_TH[key][1]+'</button>'}
  h+='</div><input id="mnote" placeholder="อยากบันทึกอะไรไหม (ไม่ใส่ก็ได้)"><button class="btn" style="width:100%;margin-top:10px" onclick="saveMood()">บันทึกความรู้สึก</button></div>';
  h+='<div class="card"><button class="btn" style="width:100%" onclick="vent()">💬 ระบายกับเลขา</button></div>';
  h+=moodTrend();
  h+='<h2>บันทึกอารมณ์ล่าสุด</h2>';
  var ms=DATA.mood||[];
  if(!ms.length){h+='<div class="empty">ยังไม่มีบันทึก — เริ่มเช็คอินความรู้สึกวันนี้ได้เลย 🤍</div>'}
  for(var i=0;i<Math.min(ms.length,25);i++){var m=ms[i];var mt=MOOD_TH[m.mood]||["🙂","—"];
    h+='<div class="rowitem"><div style="font-size:22px">'+mt[0]+'</div><div class="grow"><div class="t">'+esc(mt[1])+(m.source==="comfort"?'<span class="pill">จากแชต</span>':m.source==="heal"?'<span class="pill">🔋 ห้องพักใจ</span>':'')+'</div><div class="m">'+esc(m.note||"")+' · '+fdate(m.created_at)+'</div></div></div>';
  }
  h+='<div class="foot">🔒 อยากลบบันทึกฮีลใจทั้งหมด ทำได้ที่แท็บโปรไฟล์ (ลบข้อมูล)</div>';
  return h;
}
function moodTrend(){
  var ms=(DATA.mood||[]).filter(function(m){var t=new Date(m.created_at).getTime();return Date.now()-t<14*864e5});
  if(!ms.length){return ""}
  var cnt={},tot=0;
  for(var i=0;i<ms.length;i++){cnt[ms[i].mood]=(cnt[ms[i].mood]||0)+1;tot++}
  var bar='<div class="bar">',leg="";
  for(var key in MOOD_TH){if(cnt[key]){var pct=Math.round(cnt[key]/tot*100);bar+='<span style="width:'+pct+'%;background:'+MOOD_TH[key][2]+'"></span>';leg+='<span class="pill">'+MOOD_TH[key][0]+' '+cnt[key]+'</span>'}}
  bar+='</div>';
  return '<h2>อารมณ์ 14 วันล่าสุด ('+tot+' ครั้ง)</h2><div class="card">'+bar+'<div style="margin-top:6px">'+leg+'</div></div>';
}
function pickMood(el,key){MSEL=key;var bs=document.querySelectorAll("#moodpick button");for(var i=0;i<bs.length;i++){bs[i].className=""}el.className="on"}
async function saveMood(){
  if(!MSEL){toast("เลือกอารมณ์ก่อนนะ");return}
  var note=$("#mnote")?$("#mnote").value:"";
  var ok=await act("mood.checkin",{mood:MSEL,note:note},"บันทึกแล้ว ดูแลใจตัวเองด้วยนะ 🤍");
  if(ok)MSEL=null;
}
async function vent(){
  try{
    if(liff.isInClient()){await liff.sendMessages([{type:"text",text:"ฮีลใจ ปรับทุกข์กับเลขา"}]);liff.closeWindow()}
    else{toast("เปิดในแอป LINE เพื่อคุยกับเลขานะ")}
  }catch(e){try{liff.closeWindow()}catch(_e){toast("พิมพ์ \"ระบายหน่อย\" ในแชตได้เลย")}}
}

/* แนบรูป: ย่อก่อนส่งเสมอ — รูปจากมือถือใบละ 3-5MB ส่งดิบไป 3 ใบ = คำขอ 15MB เน็ตมือถือไม่รอด */
function hAtt(inp){
  var fs=Array.prototype.slice.call(inp.files||[]).slice(0,3-HATT.length);
  fs.forEach(function(f){
    var rd=new FileReader();
    rd.onload=function(){
      var im=new Image();
      im.onload=function(){
        var mx=1280,w=im.width,hh=im.height;
        if(w>mx||hh>mx){var sc=mx/Math.max(w,hh);w=Math.round(w*sc);hh=Math.round(hh*sc)}
        var cv=document.createElement("canvas");cv.width=w;cv.height=hh;
        cv.getContext("2d").drawImage(im,0,0,w,hh);
        HATT.push(cv.toDataURL("image/jpeg",0.82));
        hAttDraw();
      };
      im.src=rd.result;
    };
    rd.readAsDataURL(f);
  });
  inp.value="";
}
function hAttDraw(){
  var b=$("#hp_att");if(!b)return;
  var h="";
  for(var i=0;i<HATT.length;i++){h+='<div class="thumb"><img src="'+HATT[i]+'" alt="รูปที่แนบ '+(i+1)+'"><button type="button" aria-label="เอารูปที่ '+(i+1)+' ออก" onclick="hAttDel('+i+')">×</button></div>'}
  b.innerHTML=h;
}
function hAttDel(i){HATT.splice(i,1);hAttDraw()}
async function hSend(btn){
  var body=$("#hp_body").value.trim(),cat=$("#hp_cat").value;
  if(body.length<5){toast("เล่าให้ฟังอีกนิดนะ จะได้ช่วยได้ตรงจุด");return}
  if(btn){btn.disabled=true;btn.textContent="กำลังส่ง..."}
  try{
    var r=await api("support.create",{category:cat,body:body,subject:body.slice(0,80),attachments:HATT,from:"liff"});
    if(r&&r.ok===false){toast("ส่งไม่สำเร็จ ลองใหม่อีกที");if(btn){btn.disabled=false;btn.textContent="ส่งให้ทีมงาน"}return}
    HATT=[];HELP=null;toast("ส่งให้ทีมงานแล้ว 🤍");await ensureHelp();
  }catch(e){
    toast(e.message==="too_many_open"?"มีเรื่องที่ยังไม่ปิดหลายเรื่องแล้ว ตอบในเรื่องเดิมได้เลยนะ":(e.message||"ส่งไม่สำเร็จ"));
    if(btn){btn.disabled=false;btn.textContent="ส่งให้ทีมงาน"}
  }
}

/* ═══ 🗑️ ถังขยะ — ของที่ลบไปแล้วยังกู้คืนได้ 30 วัน (?tab=trash) ═══ */
var TRASH=null;
async function ensureTrash(){ if(TRASH!==null)return; try{var r=await api("trash.list",{});TRASH=r.rows||[];draw()}catch(e){TRASH=[];draw()} }
function vTrash(){
  var h='<h1>ถังขยะ</h1><div class="sub">ของที่ลบไป เก็บไว้ให้ 30 วัน กดเอากลับมาได้</div>';
  if(TRASH===null)return h+'<div class="empty">กำลังเปิดถังขยะ...</div>';
  if(!TRASH.length)return h+'<div class="empty" style="margin-top:16px">ถังขยะว่าง — ยังไม่มีอะไรที่ลบไปนะ 🤍</div><div class="foot">ลบอะไรไปแล้วเปลี่ยนใจ กลับมาหาที่นี่ได้เสมอ</div>';
  h+='<h2>ลบไปแล้ว ('+TRASH.length+')</h2>';
  for(var i=0;i<TRASH.length;i++){var r=TRASH[i];
    h+='<div class="rowitem"><div class="grow"><div class="t">'+esc(r.label)+'</div>'
      +'<div class="m">'+esc(r.kind)+' · ลบเมื่อ '+fdate(r.at)+(r.via==="chat"?" (จากแชต)":"")+'</div></div>'
      +'<button class="btn sm" onclick="unTrash('+r.id+')">'+icn("undo",14)+' เอากลับมา</button></div>';
  }
  h+='<div class="foot">ครบ 30 วันแล้วระบบจะล้างทิ้งถาวร</div>';
  return h;
}
async function unTrash(id){
  try{
    var r=await api("trash.restore",{id:id});
    if(r&&r.ok){TRASH=null;MCACHE={};await reload();await ensureTrash();toast("เอากลับมาแล้ว 🤍")}
    else{toast(r&&r.reason==="table_not_restorable"?"ของชิ้นนี้กู้คืนไม่ได้":"กู้คืนไม่สำเร็จ")}
  }catch(e){toast("กู้คืนไม่สำเร็จ")}
}

var DOW_OPTS=[[0,"อา"],[1,"จ"],[2,"อ"],[3,"พ"],[4,"พฤ"],[5,"ศ"],[6,"ส"]];
function dossInit(){
  var p=DATA.profile||{},k,i;
  DF={};
  var keys=["call_me","city","province","country","age_range","language","birth_date","occupation","org_name",
            "reply_style","marital_status","default_scope","fortune_focus","do_not_remember",
            "brief_hour","report_hour","quiet_from","quiet_to","work_start","work_end"];
  for(i=0;i<keys.length;i++){k=keys[i];DF[k]=(p[k]===undefined?null:p[k])}
  DF.selfcare=dArr(p.selfcare);DF.days_off=dArr(p.days_off);
  /* 📁 ของเดิมที่ลูกค้าเคยเล่าไว้ในแชต — เติมให้เลย ห้ามให้กรอกซ้ำ (มติบอส 3 ส.ค.) */
  var dt=(DATA&&DATA.dossier_text)||{},dk;
  for(dk in dt){if(dt[dk])DF[dk]=dt[dk]}
  /* renudge ใน DB เป็น boolean แต่ปุ่มส่งกลับมาเป็นสตริงเสมอ — แปลงตั้งแต่โหลด
     ไม่งั้นคนที่เคยตั้งไว้เปิดหน้ามาเห็น "ยังไม่ได้เลือก" ทั้งที่ค่าจริงมีอยู่ */
  DF.renudge=(p.renudge===false?"false":"true"); /* ค่าตั้งต้นของระบบคือเปิด — โชว์ให้ตรงกับที่ทำงานอยู่จริง */
}
/* ช่องที่ฝั่ง server บอกว่ายังไม่ได้คำตอบจากลูกค้า — ใช้ไฮไลต์ให้เห็นว่าเหลืออะไร
   ค่า default ที่ระบบใส่ให้ (สรุปเช้า 8 โมง ฯลฯ) นับเป็น "ยังไม่ตอบ" ตามกฎฝั่ง server */
function dNeed(f){var m=(DATA&&DATA.profile_missing)||[];return m.indexOf(f)>=0}
function dLb(f,txt){return '<label class="f'+(dNeed(f)?' need':'')+'">'+txt+(dNeed(f)?'<i class="dot"></i>':'')+'</label>'}
function dArr(v){if(!v)return[];if(typeof v==="string"){try{v=JSON.parse(v)}catch(e){return[]}}return Array.isArray(v)?v.slice():[]}
function dSet(k,v){if(!DF)dossInit();DF[k]=(DF[k]===v?null:v);draw()}
function dTog(k,v){if(!DF)dossInit();var a=DF[k]||[],i=a.indexOf(v);if(i<0)a.push(v);else a.splice(i,1);DF[k]=a;draw()}
/* seg เลือกได้ค่าเดียว (กดซ้ำ = ล้างค่า — ทางถอนข้อมูลที่ให้ไปแล้ว ตามสิทธิ์ PDPA) */
function dSeg(k,opts){
  var h='<div class="dchips">',i;
  for(i=0;i<opts.length;i++){var on=String(DF[k])===String(opts[i][0]);
    h+='<button type="button" aria-pressed="'+(on?"true":"false")+'" class="'+(on?"on":"")+'" onclick="dSet(\''+k+'\',\''+opts[i][0]+'\')">'+opts[i][1]+'</button>'}
  return h+'</div>';
}
function dMulti(k,opts){
  var cur=DF[k]||[],h='<div class="dchips">',i;
  for(i=0;i<opts.length;i++){var on=cur.indexOf(opts[i][0])>=0;
    h+='<button type="button" aria-pressed="'+(on?"true":"false")+'" class="'+(on?"on":"")+'" onclick="dTog(\''+k+'\',\''+opts[i][0]+'\')">'+opts[i][1]+'</button>'}
  return h+'</div>';
}
function dDays(){
  var cur=DF.days_off||[],h='<div class="dchips">',i;
  for(i=0;i<DOW_OPTS.length;i++){var on=cur.indexOf(DOW_OPTS[i][0])>=0;
    h+='<button type="button" aria-pressed="'+(on?"true":"false")+'" class="'+(on?"on":"")+'" onclick="dTog(\'days_off\','+DOW_OPTS[i][0]+')">'+DOW_OPTS[i][1]+'</button>'}
  return h+'</div>';
}
/* select ชั่วโมงที่ "ว่างได้" (ต่างจาก hourSel เดิมที่บังคับมีค่า) */
function dHour(id,cur){
  var h='<select id="'+id+'"><option value="">— ไม่บอกก็ได้ —</option>',i;
  for(i=0;i<24;i++){h+='<option value="'+i+'"'+(String(cur)===String(i)?" selected":"")+'>'+(i<10?"0":"")+i+':00 น.</option>'}
  return h+'</select>';
}
function dNum(id,cur,from,to,suffix){
  var h='<select id="'+id+'"><option value="">— ไม่บอกก็ได้ —</option>',i;
  for(i=from;i<=to;i++){h+='<option value="'+i+'"'+(String(cur)===String(i)?" selected":"")+'>'+i+(suffix||"")+'</option>'}
  return h+'</select>';
}
function dTa(id,ph,val){return '<textarea class="dta" id="'+id+'" maxlength="240" placeholder="'+ph+'">'+esc(val||"")+'</textarea>'}
/* 🔒 สวิตช์เดียวจบ: true = ต้องกรอกครบทุกช่องถึงจะบันทึกได้
   ตั้ง false ไว้โดยตั้งใจ — บังคับกรอกครบแล้วคนที่ติดข้อเดียว (เช่นไม่อยากบอกสถานะ)
   จะกดออกทั้งหน้า เราได้ 0 ช่อง ซึ่งแย่กว่าปล่อยข้ามแล้วได้ 25 จาก 32 ช่อง
   วิธีดันให้กรอกครบที่ใช้แทน: แบ่ง 2 หน้าให้เห็นปลายทาง · บอกทุกหมวดว่าได้อะไร ·
   นับช่องว่างค้างให้เห็น · จบแล้วเลขาทวงต่อในแชตวันละข้อ */
var DOSS_REQUIRE_ALL=false;
var DPAGE=1;
/* ช่องพิมพ์ทั้งหมด: id ในหน้า -> คีย์ใน DF · ใช้ทั้งตอนสลับหน้าและตอนบันทึก
   ⚠️ สลับหน้า = DOM ชุดเดิมถูกทิ้ง ต้องกวาดค่าลง DF ก่อนทุกครั้ง ไม่งั้นที่พิมพ์ไว้หายเกลี้ยง */
var DTXT={
  1:{d_call:"call_me",d_birth:"birth_date",d_city:"city",d_prov:"province",d_ctry:"country",
     d_oc:"occupation",d_org:"org_name",d_bz:"business_story",d_pain:"work_pain",d_rout:"routine_work"},
  2:{d_gw:"goal_work",d_gl:"goal_life",d_like:"likes",d_ff:"fortune_focus",d_no:"do_not_remember"}
};
var DSEL={1:{d_ws:"work_start",d_we:"work_end"},2:{d_bh:"brief_hour",d_rh:"report_hour",d_qf:"quiet_from",d_qt:"quiet_to"}};
function dStash(){
  if(!DF)return;
  var m=DTXT[DPAGE]||{},k;
  for(k in m){var e=$("#"+k);if(e)DF[m[k]]=e.value.trim()}
  var m2=DSEL[DPAGE]||{};
  for(k in m2){var e2=$("#"+k);if(e2)DF[m2[k]]=(e2.value===""?null:Number(e2.value))}
}
function dGo(n){dStash();DPAGE=n;draw();window.scrollTo(0,0)}
/* นับช่องที่ยังว่างในหน้านั้น — ใช้ดันให้กรอกต่อ (ไม่ได้บล็อก) */
function dBlanks(page){
  var need=(page===1)
    ?["call_me","birth_date","city","province","country","occupation","org_name","business_story","work_pain","routine_work","work_start","work_end","age_range","language"]
    :["brief_hour","report_hour","quiet_from","quiet_to","reply_style","renudge","marital_status","goal_work","goal_life","likes","fortune_focus","default_scope","do_not_remember"];
  var n=0,i;
  for(i=0;i<need.length;i++){var v=DF[need[i]];if(v===null||v===undefined||v==="")n++}
  if(page===1&&!(DF.days_off||[]).length)n++;
  if(page===2&&!(DF.selfcare||[]).length)n++;
  if(page===2&&!((DATA.people||[]).length))n++;
  return n;
}
/* หางเสียงแบบ "นะคะ/นะครับ/นะจ๊ะ" — ต่อ pt() ตรงๆ ไม่ได้ จะได้ "นะค่ะ" ซึ่งเขียนผิด */

/* 💬 คำเปิดหน้าแฟ้ม — บอสวางอารมณ์ไว้ 2 ส.ค.: "เลขาเพิ่งเข้างานวันแรก ขอฟังเรื่องบอส"

   ถ้ารู้ว่ายาวแค่ไหนและได้อะไรกลับ ที่ทำให้เลิกกลางคันคือไม่รู้ทั้งสองอย่าง */

function dRelTh(r){var i;for(i=0;i<REL_OPTS.length;i++){if(REL_OPTS[i][0]===r)return REL_OPTS[i][1]}return "คนสำคัญ"}
function dMd(d){var p=String(d||"").split("-");return p.length===3?(p[2]+"/"+p[1]):""}
function dVal(id){var e=$(id);return e?e.value.trim():""}
function dValN(id){var e=$(id);return(e&&e.value!=="")?Number(e.value):null}
/* payload ชุดเดียวใช้ทั้งตอนกด "ถัดไป" (เซฟหน้า 1 กันของหาย) และตอนกด "บันทึกแฟ้ม"
   ต้องอ่านจาก DF ล้วน ไม่แตะ DOM — เพราะตอนบันทึก ช่องของหน้า 1 ไม่อยู่บนจอแล้ว */
function dPayload(){
  return {
    call_me:DF.call_me||"",occupation:DF.occupation||"",org_name:DF.org_name||"",
    city:DF.city||"",province:DF.province||"",country:DF.country||"",
    fortune_focus:DF.fortune_focus||"",do_not_remember:DF.do_not_remember||"",
    birth_date:DF.birth_date||"",
    age_range:DF.age_range||"",language:DF.language||"",
    reply_style:DF.reply_style||"",marital_status:DF.marital_status||"",default_scope:DF.default_scope||"",
    selfcare:DF.selfcare||[],days_off:DF.days_off||[],
    brief_hour:DF.brief_hour,report_hour:DF.report_hour,quiet_from:DF.quiet_from,quiet_to:DF.quiet_to,
    work_start:DF.work_start,work_end:DF.work_end,
    renudge:(DF.renudge===true||DF.renudge==="true"),
    /* คำตอบปลายเปิด -> เข้าคลังความจำ (ฝั่ง server สกัดเป็น fact ให้ คนละ attribute จึงไม่ทับกัน) */
    business_story:DF.business_story||"",work_pain:DF.work_pain||"",routine_work:DF.routine_work||"",
    goal_work:DF.goal_work||"",goal_life:DF.goal_life||"",likes:DF.likes||""
  };
}
async function saveDossier(){
  if(DBUSY)return;
  dStash();
  if(DOSS_REQUIRE_ALL){
    var miss=dBlanks(1)+dBlanks(2);
    if(miss>0){toast("กรอกให้ครบก่อนนะ ยังว่างอีก "+miss+" ช่อง");return}
  }
  DBUSY=true;
  try{
    var res=await api("profile.update",dPayload());
    var left=dBlanks(1)+dBlanks(2);
    DF=null;DPAGE=1;await reload();
    /* ยังว่างอยู่ = ชวนกลับมาเติมแบบนุ่มๆ ไม่ใช่บล็อก (ทางถอนต้องมีเสมอ) */
    toast(left>0
      ? ("บันทึกแล้ว 🙌 เลขารู้จักบอส "+(res&&res.profile_pct!=null?res.profile_pct:"?")+"% — ยังว่างอีก "+left+" ช่อง กลับมาเติมได้ทุกเมื่อ")
      : ("บันทึกครบทุกช่องแล้ว 🎉 เลขารู้จักบอส "+(res&&res.profile_pct!=null?res.profile_pct:"100")+"% แล้ว"));
    go("me");
  }catch(e){toast(e.message||"บันทึกไม่สำเร็จ ลองใหม่อีกที")}
  DBUSY=false;
}
async function addPerson(){
  var nm=dVal("#d_pname");
  if(!nm){toast("ใส่ชื่อคนที่อยากให้เลขาจำหน่อยนะ");return}
  var r=await api("people.save",{name:nm,relation:dVal("#d_prel")||"other",birth_date:dVal("#d_pbd"),note:dVal("#d_pnote")}).catch(function(e){return{error:e.message}});
  if(r&&r.error==="cap"){toast("แฟ้มเต็ม 20 คนแล้ว ลบคนที่ไม่ใช้ก่อนนะ");return}
  if(r&&r.error){toast("เพิ่มไม่สำเร็จ ลองใหม่อีกที");return}
  DF=null;await reload();toast("จำ "+nm+" ไว้แล้ว 💛");
}
async function delPerson(id,nm){
  var ok=await dlg({title:"ลบ "+nm+" ออกจากแฟ้ม?",okText:"ลบ",body:"เลขาจะเลิกจำและเลิกเตือนวันเกิดของคนนี้"});
  if(!ok)return;
  await api("people.del",{id:id});DF=null;await reload();toast("ลบแล้ว");
}
async function addBill(){
  var t=dVal("#d_bt"),d=dValN("#d_bd");
  if(!t){toast("ใส่ชื่อบิลหน่อยนะ เช่น ค่าเช่าร้าน");return}
  if(!d){toast("เลือกวันที่ที่ต้องจ่ายด้วยนะ");return}
  var r=await api("bill.add",{title:t,day:d,amount:dValN("#d_ba")}).catch(function(e){return{error:e.message}});
  if(r&&r.error){toast("ตั้งเตือนไม่สำเร็จ ลองใหม่อีกที");return}
  var e1=$("#d_bt");if(e1)e1.value="";var e2=$("#d_ba");if(e2)e2.value="";
  DF=null;await reload();toast("ตั้งเตือนทุกวันที่ "+d+" ให้แล้ว ⏰");
}

/* ---------- 🔋 ห้องพักใจ: เกมชาร์จพลังใจ (หลอดแดง→เขียว จบด้วยก้าวจริง + เช็คเอาต์ตามจริง) ----------
   หลักการ: สิ่งที่พิมพ์ระบายไม่ถูกส่งขึ้นระบบเลย (อยู่ในเครื่องแล้วทิ้ง) — บันทึกเฉพาะผลเช็คเอาต์ผ่าน heal.log
   น้ำเสียงตาม character จริงของผู้ใช้ (pt()) ; ปุ่ม "ตั้งเตือน" ยิง reminder.add = เข้าระบบเตือนจริงของเลขา */
(function(){
var timers=[],P="ครับ",BATT=8,chargeTok=0,curSteps=[],si=0,journeyKey="",HS={};
var STOPS=[[0,[229,72,77]],[33,[240,136,62]],[66,[245,215,10]],[100,[48,209,88]]];
var GREEN=[48,209,88],EMO=[90,120,180];
function delay(fn,ms){var id=setTimeout(fn,ms);timers.push(id);return id}
function every(fn,ms){var id=setInterval(fn,ms);timers.push(id);return id}
function clearTimers(){for(var i=0;i<timers.length;i++){clearTimeout(timers[i]);clearInterval(timers[i])}timers=[]}
function $h(x){return document.getElementById(x)}

function kbNa(){return P==="ครับ"?"นะครับ":P==="ค่ะ"?"นะคะ":"นะ"}
function lerp(a,b,t){return[Math.round(a[0]+(b[0]-a[0])*t),Math.round(a[1]+(b[1]-a[1])*t),Math.round(a[2]+(b[2]-a[2])*t)]}
function bcol(p){var a=STOPS[0];for(var i=1;i<STOPS.length;i++){var b=STOPS[i];if(p<=b[0])return lerp(a[1],b[1],(p-a[0])/(b[0]-a[0]));a=b}return GREEN}
function rgbs(c){return"rgb("+c[0]+","+c[1]+","+c[2]+")"}
function setBatt(p){BATT=Math.max(0,Math.min(100,p));var fc=bcol(BATT);
  $h("hrfill").style.width=BATT+"%";$h("hrfill").style.background=rgbs(fc);$h("hrfill").style.boxShadow="0 0 18px "+rgbs(fc);
  $h("hrpct").textContent=Math.round(BATT)+"%";$h("hrpct").style.color=rgbs(fc);
  var sc=lerp(EMO,GREEN,BATT/100);
  $h("hrscene").style.background="radial-gradient(95% 65% at 50% 6%,rgba("+sc[0]+","+sc[1]+","+sc[2]+",.5),transparent),radial-gradient(80% 60% at 72% 100%,rgba("+sc[0]+","+sc[1]+","+sc[2]+",.25),transparent),#0b1020"}
function chargeTo(target,lbl,cb){var tk=++chargeTok;
  $h("hrblbl").innerHTML='<span class="bolt on">⚡</span> '+(lbl||"กำลังชาร์จ...");
  var start=BATT,t0=null;
  function s(ts){if(tk!==chargeTok)return;if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/900);
    setBatt(start+(target-start)*k);
    if(k<1)requestAnimationFrame(s);else{$h("hrblbl").innerHTML="พลังใจ "+Math.round(target)+"% 🔋";if(cb)cb()}}
  requestAnimationFrame(s)}
function burst(list,anim,n){var ph=$h("healroom");
  for(var i=0;i<n;i++){(function(i){delay(function(){
    var e=document.createElement("div");e.className="hp";e.textContent=list[Math.floor(Math.random()*list.length)];
    e.style.left=(12+Math.random()*76)+"%";e.style.top=(anim==="hrsink"?"44%":"66%");
    e.style.setProperty("--dx",(Math.random()*120-60)+"px");e.style.setProperty("--r",(Math.random()*180-90)+"deg");
    e.style.animation=anim+" "+(1.6+Math.random()*1.2)+"s ease-out forwards";ph.appendChild(e);
    setTimeout(function(){e.remove()},3200)},i*45)})(i)}}
function render(h){clearTimers();chargeTok++;
  $h("hrstage").innerHTML='<div class="hinner hfade">'+h+'</div>';

function stepBreathe(t){render(head("คุมลมหายใจก่อน")+
  '<h1 style="font-size:19px">ร่างกายนำใจเสมอ — คุมลมหายใจได้ ก็ดึงเกมกลับมาได้<span class="soft">1 เฮือกยาว ๆ ตามวงกลม (เข้า 4 · ค้าง 2 · ออก 6 วินาที) ปล่อยให้ไหล่ตกลงตอนหายใจออก</span></h1>'+

  function breatheOnce(done){
    function phase(txt,scale,secs,next){var o=$h("hrorb");if(!o)return;
      o.style.transitionDuration=secs+"s";o.style.transform="scale("+scale+")";
      var left=secs;o.innerHTML=txt+"<br>"+left;

    phase("สูดเข้า...",1.5,4,function(){phase("ค้างไว้...",1.5,2,function(){phase("ผ่อนออก... ไหล่ตก",1,6,done)})})}

/* 🛡️ ปิดบังเบอร์โดยปริยาย — แตะเพื่อดู แล้วปิดเองใน 6 วิ (กันคนมองข้างจอ/หลุดตอนแคป) */
function phMaskTxt(p){p=String(p);return p.length>=7?p.slice(0,3)+'•••'+p.slice(-3):'•••'}
function phMask(p){return '<span data-ph="'+esc(p)+'" onclick="phReveal(this);event.stopPropagation()" style="cursor:pointer;border-bottom:1px dashed #C4547E">'+phMaskTxt(p)+' 👁</span>'}
window.phReveal=function(el){var f=el.getAttribute('data-ph')||'';if(el.getAttribute('data-on')==='1'){el.setAttribute('data-on','');el.innerHTML=phMaskTxt(f)+' 👁';return}el.setAttribute('data-on','1');el.textContent=f;setTimeout(function(){if(el.getAttribute('data-on')==='1'){el.setAttribute('data-on','');el.innerHTML=phMaskTxt(f)+' 👁'}},6000)};

/* 🛡️ ม่านความเป็นส่วนตัว: สลับแอป/พับจอปุ๊บ เบลอทั้งหน้า -> ภาพ preview ใน app switcher เป็นม่าน ไม่ใช่ข้อมูลบอส

(function(){
var v=document.createElement('div');v.id='pveil';
v.style.cssText='position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,.78);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)';
v.innerHTML='<div style="text-align:center;color:#C4547E;font-weight:800;font-size:17px">🔒<br>ปกป้องข้อมูลของบอสอยู่<div style="font-size:12px;color:#85858E;font-weight:600;margin-top:5px">แตะเพื่อดูต่อ</div></div>';
v.onclick=function(){v.style.display='none'};
document.body.appendChild(v);
document.addEventListener('visibilitychange',function(){v.style.display=document.hidden?'flex':'none'});
/* 🔄 กลับมาที่หน้า (สลับไปแชต/ย่อหน้าต่าง LIFF แล้วกลับมา) + ข้อมูลเก่ากว่า 20 วิ -> ดึงยอดใหม่เอง
   แก้เคสจริง: จดเงินในแชตแล้วสลับกลับมา แดชบอร์ดโชว์เลขเก่า ลูกค้าคิดว่าไม่บันทึก เลยส่งสลิปซ้ำ (2026-07-09) */
document.addEventListener('visibilitychange',function(){if(!document.hidden&&DATA&&LSYNC&&Date.now()-LSYNC>20000){MCACHE={};reload().catch(function(){})}});
window.addEventListener('pageshow',function(e){if(e&&e.persisted&&DATA){MCACHE={};reload().catch(function(){})}});
window.addEventListener('pagehide',function(){v.style.display='flex'});
})();

boot();
</script>
